<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Test profil</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="../firebase-config.js"></script>
</head>
<body>
  <div id="test"></div>

  <script>
    const testDiv = document.getElementById("test");

    firebase.auth().onAuthStateChanged(function(user) {
      if (!user) {
        testDiv.textContent = "Pas connecté.";
        return;
      }

      testDiv.textContent = "Connecté : " + user.uid;

      db.ref("eleves/" + user.uid).once("value")
        .then(function(snap) {
          const data = snap.val();
          if (!data) {
            testDiv.textContent += "
Aucune donnée dans eleves/" + user.uid;
          } else {
            testDiv.textContent += "
Données : " + JSON.stringify(data);
          }
        })
        .catch(function(err) {
          testDiv.textContent += "
Erreur Firebase : " + err.message;
        });
    });
  </script>
</body>
</html>
