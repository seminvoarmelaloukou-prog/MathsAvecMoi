<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes résultats - Campus Flex</title>
<meta name="theme-color" content="#2c3e8c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="pwa-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<link rel="stylesheet" href="campus.css">
<link rel="stylesheet" href="campus-menu.css">
<script src="campus-menu.js" defer></script>
<style>
[hidden]{display:none !important}
.filtres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 18px}
.filtres button{min-height:46px;padding:8px 6px;border-radius:999px;background:transparent;color:var(--ink);border-color:var(--ink);font-size:.92rem}
.filtres button[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-fg)}

.m-entete{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.m-tuile{flex:none;width:52px;height:52px;border-radius:12px;background:var(--c);color:#fff;font-weight:800;font-size:.95rem;display:flex;align-items:center;justify-content:center}
.m-entete h2{margin:0}
.m-meta{color:var(--muted);font-size:.9rem;font-weight:600}

.ligne{padding:12px 14px;border-left:5px solid var(--c);background:var(--paper);border-radius:6px;margin-bottom:10px;animation:pop .3s ease both}
.ligne:last-child{margin-bottom:0}
.ligne .haut{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.ligne .titre{font-weight:800;overflow-wrap:anywhere}
.ligne .score{font-weight:800;color:var(--ink);white-space:nowrap;font-size:1.05rem}
.ligne .bas{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px;color:var(--muted);font-size:.9rem}
.badge-type{font-size:.75rem;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--hl);color:var(--ink)}
.badge-type.off{background:var(--ink);color:var(--bg)}
.jauge{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:8px}
.jauge div{height:100%;width:0;background:var(--amber);border-radius:999px;transition:width .7s ease}
.vide .btn{margin-top:14px}
</style>
</head>

<body>

<header class="barre">
  <div class="barre-haut">
    <a class="marque" href="index.html"><img data-garder src="logo-icone.png" alt="">Campus Flex</a>
    <button class="burger" id="burger" type="button" aria-expanded="false" aria-controls="menu-principal" aria-label="Ouvrir le menu"><span></span><span></span><span></span></button>
  </div>
  <div class="menu-panneau" id="menu-principal" role="navigation" aria-label="Navigation principale">
    <div class="interieur"><div class="liens">
        <a href="profil.html">Mon profil</a>
        <a href="matieres.html">Matières</a>
        <a href="composition.html">Composer</a>
        <a href="echanges.html">Échanges</a>
        <a href="emploi-eleve.html">Emploi du temps</a>
        <a href="bulletin.html">Mon bulletin</a>
        <a href="mes-resultats.html">Mes résultats</a>
        <a href="index.html">Accueil</a>
        <a href="#" class="sortie" data-deconnexion id="deconnexion" data-propre>Se déconnecter</a>
    </div></div>
  </div>
</header>

<main>

  <p class="salut ecrit">Mes résultats</p>

  <section class="carte" id="intro">
    <p class="aide">Tous tes résultats d’évaluations, rangés par matière.</p>
    <div class="filtres" role="group" aria-label="Filtrer les résultats" style="margin:14px 0 0">
      <button type="button" data-filtre="tous" aria-pressed="true">Tous</button>
      <button type="button" data-filtre="blanche" aria-pressed="false">Blanches</button>
      <button type="button" data-filtre="officielle" aria-pressed="false">Officielles</button>
    </div>
  </section>

  <div id="resultats"><section class="carte"><div class="loader"></div><p class="aide" style="margin-top:12px">Chargement…</p></section></div>

</main>

<footer>© 2026 Campus Flex - Tous droits réservés - <a href="contact.html">Contact</a></footer>

<script>
  var MATIERES = [
    { nom: "Mathématiques", court: "Ma", couleur: "#2c3e8c" },
    { nom: "Français", court: "Fr", couleur: "#B23A48" },
    { nom: "Anglais", court: "An", couleur: "#1F7A8C" },
    { nom: "PCT", court: "PCT", couleur: "#7A3E9D" },
    { nom: "SVT", court: "SVT", couleur: "#2E7D32" },
    { nom: "Histoire-Géographie", court: "HG", couleur: "#8A5A00" },
    { nom: "Philosophie", court: "Ph", couleur: "#4A4E69" },
    { nom: "EPS", court: "EPS", couleur: "#C2410C" },
    { nom: "Espagnol", court: "Es", couleur: "#A15C07" },
    { nom: "Allemand", court: "Al", couleur: "#374151" }
  ];
  // Les anciens résultats n'avaient pas de matière : le site ne comptait alors que des maths
  var MATIERE_PAR_DEFAUT = "Mathématiques";

  var conteneur = document.getElementById("resultats");
  var btnDeconnexion = document.getElementById("deconnexion");
  var userActuel = null;
  var tous = [];
  var filtre = "tous";
  var enErreur = [];

  btnDeconnexion.addEventListener("click", function (e) {
    e.preventDefault();
    if (!confirm("Veux-tu vraiment te déconnecter ?")) { return; }
    firebase.auth().signOut()
      .then(function () { window.location.href = "connexion.html"; })
      .catch(function (err) {
        console.error("Erreur déconnexion :", err);
        alert("Une erreur est survenue lors de la déconnexion.");
      });
  });

  window.addEventListener("load", function () {
    if (!firebase.auth || !firebase.database) {
      conteneur.innerHTML = "";
      message("Service non disponible pour le moment.", true);
      return;
    }
    firebase.auth().onAuthStateChanged(function (user) {
      if (!user) { window.location.href = "connexion.html"; return; }
      userActuel = user;
      charger();
    });
  });

  function message(texte, erreur) {
    var c = document.createElement("section");
    c.className = "carte";
    var p = document.createElement("p");
    p.className = erreur ? "erreur" : "aide";
    p.textContent = texte;
    c.appendChild(p);
    conteneur.appendChild(c);
  }

  function lire(chemin, type, libelle) {
    return firebase.database().ref(chemin + userActuel.uid).once("value").then(function (snap) {
      var liste = [];
      if (snap && snap.exists()) {
        var data = snap.val();
        Object.keys(data).forEach(function (cle) {
          var r = data[cle];
          if (!r || typeof r !== "object") { return; }
          r.id = cle; r.type = type;
          liste.push(r);
        });
      }
      return liste;
    }).catch(function (err) {
      console.error("Erreur chargement " + libelle + " :", err);
      enErreur.push(libelle);
      return [];
    });
  }

  function charger() {
    Promise.all([
      lire("evaluations_blanches/resultats/", "blanche", "évaluations blanches"),
      lire("evaluations/resultats/", "officielle", "évaluations officielles")
    ]).then(function (r) {
      tous = r[0].concat(r[1]);
      afficher();
    });
  }

  document.querySelectorAll(".filtres button").forEach(function (b) {
    b.addEventListener("click", function () {
      filtre = b.getAttribute("data-filtre");
      document.querySelectorAll(".filtres button").forEach(function (x) {
        x.setAttribute("aria-pressed", x === b ? "true" : "false");
      });
      afficher();
    });
  });

  // Anciens champs (datePassation, maxScore) et nouveaux (date, totalPoints)
  function getDate(r) { return r.date || r.datePassation || null; }
  function getTotal(r) {
    return typeof r.totalPoints === "number" ? r.totalPoints : (typeof r.maxScore === "number" ? r.maxScore : null);
  }
  function matiereDe(r) { return (r.matiere && String(r.matiere).trim()) || MATIERE_PAR_DEFAUT; }
  function infoMatiere(nom) {
    for (var i = 0; i < MATIERES.length; i++) { if (MATIERES[i].nom === nom) { return MATIERES[i]; } }
    return { nom: nom, court: nom.slice(0, 2), couleur: "#46547A" };
  }

  function afficher() {
    conteneur.innerHTML = "";

    if (enErreur.length) {
      message("Impossible de charger tes résultats d’" + enErreur.join(" et d’") + ".", true);
    }

    var visibles = tous.filter(function (r) { return filtre === "tous" || r.type === filtre; });

    if (!visibles.length) {
      var c = document.createElement("section");
      c.className = "carte vide";
      var p = document.createElement("p");
      p.className = "aide";
      p.textContent = tous.length
        ? "Aucun résultat de ce type pour le moment."
        : "Tu n’as encore passé aucune évaluation.";
      c.appendChild(p);
      var a = document.createElement("a");
      a.href = "composition.html"; a.className = "btn"; a.textContent = "Composer une évaluation";
      c.appendChild(a);
      conteneur.appendChild(c);
      return;
    }

    // Regroupement par matière
    var groupes = {};
    visibles.forEach(function (r) {
      var m = matiereDe(r);
      (groupes[m] = groupes[m] || []).push(r);
    });

    var ordre = MATIERES.map(function (m) { return m.nom; }).filter(function (n) { return groupes[n]; });
    Object.keys(groupes).sort().forEach(function (n) { if (ordre.indexOf(n) === -1) { ordre.push(n); } });

    ordre.forEach(function (nom, gi) {
      var liste = groupes[nom].sort(function (a, b) { return (getDate(b) || 0) - (getDate(a) || 0); });
      var info = infoMatiere(nom);

      var carte = document.createElement("section");
      carte.className = "carte";
      carte.style.setProperty("--c", info.couleur);

      // En-tête : tuile + nom + résumé
      var pourcentages = liste.map(function (r) {
        var t = getTotal(r);
        return (typeof r.score === "number" && typeof t === "number" && t > 0) ? r.score * 100 / t : null;
      }).filter(function (x) { return x !== null; });
      var moyenne = pourcentages.length
        ? Math.round(pourcentages.reduce(function (a, b) { return a + b; }, 0) / pourcentages.length) : null;

      var entete = document.createElement("div");
      entete.className = "m-entete";
      var tuile = document.createElement("span");
      tuile.className = "m-tuile"; tuile.textContent = info.court; tuile.setAttribute("aria-hidden", "true");
      var bloc = document.createElement("div");
      var h2 = document.createElement("h2"); h2.textContent = nom;
      var meta = document.createElement("div"); meta.className = "m-meta";
      meta.textContent = liste.length + " évaluation" + (liste.length > 1 ? "s" : "") +
        (moyenne !== null ? " · moyenne " + moyenne + " %" : "");
      bloc.appendChild(h2); bloc.appendChild(meta);
      entete.appendChild(tuile); entete.appendChild(bloc);
      carte.appendChild(entete);

      // Résultats de la matière
      liste.forEach(function (r, i) {
        var ligne = document.createElement("div");
        ligne.className = "ligne";
        ligne.style.animationDelay = (gi * 0.08 + i * 0.05) + "s";

        var libelleType = r.type === "officielle" ? "Évaluation officielle" : "Évaluation blanche";
        var titre = r.titre
          ? r.titre + (r.sequence ? " (" + r.sequence + ")" : "")
          : libelleType + " – " + (r.classe || "classe non précisée");

        var total = getTotal(r);
        var aScore = typeof r.score === "number" && typeof total === "number";

        var haut = document.createElement("div"); haut.className = "haut";
        var t = document.createElement("span"); t.className = "titre"; t.textContent = titre;
        var s = document.createElement("span"); s.className = "score";
        s.textContent = aScore ? r.score + " / " + total : "—";
        haut.appendChild(t); haut.appendChild(s);

        var bas = document.createElement("div"); bas.className = "bas";
        var badge = document.createElement("span");
        badge.className = "badge-type" + (r.type === "officielle" ? " off" : "");
        badge.textContent = r.type === "officielle" ? "Officielle" : "Blanche";
        var d = getDate(r);
        var dateTxt = document.createElement("span");
        dateTxt.textContent = d ? new Date(d).toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric" }) : "Date inconnue";
        bas.appendChild(badge); bas.appendChild(dateTxt);

        ligne.appendChild(haut); ligne.appendChild(bas);

        if (aScore && total > 0) {
          var jauge = document.createElement("div"); jauge.className = "jauge";
          var rempli = document.createElement("div");
          jauge.appendChild(rempli); ligne.appendChild(jauge);
          var pc = Math.max(0, Math.min(100, Math.round(r.score * 100 / total)));
          setTimeout(function () { rempli.style.width = pc + "%"; }, 80);
        } else if (!aScore) {
          var nd = document.createElement("div"); nd.className = "m-meta"; nd.textContent = "Score non disponible";
          ligne.appendChild(nd);
        }
        carte.appendChild(ligne);
      });

      conteneur.appendChild(carte);
    });
  }
</script>

</body>
</html>
