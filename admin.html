<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration — Campus Flex</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth-guard.js"></script>

<style>
  body{ font-family:sans-serif; background:#f5f7ff; margin:0; padding:20px; }
  h1{ color:#2c3e8c; }
  .msg{ color:#B3401F; }
</style>
</head>
<body>

  <h1>Administration</h1>
  <div id="contenu">
    <p>Vérification des droits...</p>
  </div>
<script>
(function(){
  const contenu = document.getElementById('contenu');

  function afficherRefus(){
    contenu.innerHTML = '<p class="msg">Accès réservé aux administrateurs.</p>';
  }

  firebase.auth().onAuthStateChanged(function(user){
    if (!user) return; // auth-guard.js gère déjà la redirection si non connecté

    if (typeof db === 'undefined' || !db){
      afficherRefus();
      return;
    }

    db.ref('admins/' + user.uid).once('value')
      .then(function(snap){
        if (snap.val() === true){
          contenu.innerHTML = '<p>Bienvenue, tu es bien administrateur.</p>';
          // La suite (liste des élèves, formulaire de modification) viendra ici.
        } else {
          afficherRefus();
        }
      })
      .catch(function(erreur){
        console.error('admin.html : erreur de vérification :', erreur);
        afficherRefus();
      });
  });
})();
</script>
</body>
</html>
