<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon carnet — Campus Flex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2B22;
    --paper:#F5F1E4;
    --card:#FFFFFF;
    --forest:#2F6F4E;
    --forest-dark:#1F4E36;
    --amber:#E8A33D;
    --amber-dark:#C77F1F;
    --line:#DCD5C1;
    --muted:#6B7568;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  .topbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:18px 20px 14px;
  }
  .topbar .mark{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:1.15rem;
    letter-spacing:.2px;
  }
  .topbar .mark span{ color:var(--forest); }

  .wrap{ max-width:480px; margin:0 auto; padding:0 18px; }

  /* ---- Formulaire de création de compte ---- */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:26px 22px;
    margin-top:10px;
  }
  .card h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:1.6rem;
    margin:0 0 6px;
    line-height:1.2;
  }
  .card p.lead{
    color:var(--muted);
    margin:0 0 22px;
    font-size:.95rem;
  }
  label{
    display:block;
    font-size:.8rem;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--forest-dark);
    margin:16px 0 6px;
  }
  input[type=text], select{
    width:100%;
    padding:12px 13px;
    border:1.5px solid var(--line);
    border-radius:9px;
    font-family:'Work Sans', sans-serif;
    font-size:1rem;
    background:#FCFAF4;
    color:var(--ink);
  }
  input[type=text]:focus, select:focus{
    outline:2px solid var(--forest);
    outline-offset:1px;
    border-color:var(--forest);
  }
  optgroup{ font-weight:600; }
  .phone-row{
    display:flex;
    gap:8px;
  }
  .phone-prefix{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 12px;
    border:1.5px solid var(--line);
    border-radius:9px;
    background:#EFEAD8;
    color:var(--forest-dark);
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:.95rem;
    white-space:nowrap;
  }
  .phone-row input{ flex:1; }
  button.primary{
    width:100%;
    margin-top:24px;
    padding:14px;
    border:none;
    border-radius:9px;
    background:var(--forest);
    color:#fff;
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:1rem;
    cursor:pointer;
  }
  button.primary:active{ background:var(--forest-dark); }
  .error{
    color:#B3401F;
    font-size:.85rem;
    margin-top:8px;
    display:none;
  }

  /* ---- Tableau de bord ---- */
  .greet{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-top:6px;
  }
  .greet h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:1.5rem;
    margin:0;
  }
  .classe-pill{
    display:inline-block;
    margin-top:6px;
    padding:4px 11px;
    background:#EAF2ED;
    color:var(--forest-dark);
    border-radius:20px;
    font-size:.78rem;
    font-weight:600;
  }
  .edit-link{
    background:none;
    border:none;
    color:var(--muted);
    font-size:.78rem;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }

  .streak-card{
    margin-top:20px;
    background:var(--forest);
    border-radius:16px;
    padding:22px;
    color:#fff;
    position:relative;
    overflow:hidden;
  }
  .streak-card::after{
    content:"";
    position:absolute;
    right:-30px; top:-30px;
    width:120px; height:120px;
    border-radius:50%;
    background:rgba(255,255,255,.06);
  }
  .streak-top{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .streak-num{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:2.6rem;
    line-height:1;
  }
  .streak-label{
    font-size:.85rem;
    opacity:.85;
  }
  .streak-sub{
    margin-top:4px;
    font-size:.85rem;
    opacity:.85;
  }
  .checkin-btn{
    margin-top:18px;
    width:100%;
    padding:13px;
    border:none;
    border-radius:9px;
    background:var(--amber);
    color:#2A1D06;
    font-weight:600;
    font-size:.95rem;
    cursor:pointer;
  }
  .checkin-btn[disabled]{
    background:rgba(255,255,255,.18);
    color:rgba(255,255,255,.75);
  }

  .stats-row{
    display:flex;
    gap:12px;
    margin-top:14px;
  }
  .stat{
    flex:1;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 12px;
    text-align:center;
  }
  .stat .num{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:1.4rem;
    color:var(--forest-dark);
  }
  .stat .lbl{
    font-size:.72rem;
    color:var(--muted);
    margin-top:2px;
  }

  .section-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.05rem;
    margin:26px 0 12px;
  }

  .badges{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
  }
  .badge{
    background:var(--card);
    border:1.5px dashed var(--line);
    border-radius:50%;
    aspect-ratio:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:8px;
  }
  .badge.unlocked{
    border-style:solid;
    border-color:var(--amber);
    background:#FFF7E9;
  }
  .badge .icon{ font-size:1.5rem; opacity:.35; }
  .badge.unlocked .icon{ opacity:1; }
  .badge .name{
    font-size:.62rem;
    font-weight:600;
    margin-top:4px;
    color:var(--muted);
    line-height:1.15;
  }
  .badge.unlocked .name{ color:var(--forest-dark); }

  .toast{
    position:fixed;
    left:50%; bottom:24px;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:#fff;
    padding:12px 18px;
    border-radius:10px;
    font-size:.88rem;
    opacity:0;
    transition:opacity .25s, transform .25s;
    pointer-events:none;
    max-width:88%;
    text-align:center;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  [hidden]{ display:none !important; }
</style>
</head>
<body>

<div class="topbar">
  <div class="mark">💡 Campus<span>Flex</span></div>
</div>

<div class="wrap">

  <!-- ===== Écran 1 : création de compte ===== -->
  <section id="onboarding" class="card">
    <h1>Ton carnet de bord</h1>
    <p class="lead">Indique ton prénom et ta classe pour commencer à suivre ta progression.</p>

    <label for="nom">Nom</label>
    <input type="text" id="nom" placeholder="Ex : SAVI" autocomplete="family-name">

    <label for="prenom">Prénom</label>
    <input type="text" id="prenom" placeholder="Ex : Armelle" autocomplete="given-name">

    <label for="pays">Pays</label>
    <select id="pays">
      <option value="">Choisis ton pays</option>
      <option value="+229" data-nom="Bénin" selected>🇧🇯 Bénin (+229)</option>
      <option value="+228" data-nom="Togo">🇹🇬 Togo (+228)</option>
      <option value="+225" data-nom="Côte d'Ivoire">🇨🇮 Côte d'Ivoire (+225)</option>
      <option value="+221" data-nom="Sénégal">🇸🇳 Sénégal (+221)</option>
      <option value="+223" data-nom="Mali">🇲🇱 Mali (+223)</option>
      <option value="+226" data-nom="Burkina Faso">🇧🇫 Burkina Faso (+226)</option>
      <option value="+227" data-nom="Niger">🇳🇪 Niger (+227)</option>
      <option value="+224" data-nom="Guinée">🇬🇳 Guinée (+224)</option>
      <option value="+233" data-nom="Ghana">🇬🇭 Ghana (+233)</option>
      <option value="+234" data-nom="Nigeria">🇳🇬 Nigeria (+234)</option>
      <option value="+245" data-nom="Guinée-Bissau">🇬🇼 Guinée-Bissau (+245)</option>
      <option value="+238" data-nom="Cap-Vert">🇨🇻 Cap-Vert (+238)</option>
      <option value="+220" data-nom="Gambie">🇬🇲 Gambie (+220)</option>
      <option value="+232" data-nom="Sierra Leone">🇸🇱 Sierra Leone (+232)</option>
      <option value="+231" data-nom="Liberia">🇱🇷 Liberia (+231)</option>
      <option value="+222" data-nom="Mauritanie">🇲🇷 Mauritanie (+222)</option>
      <option value="autre" data-nom="Autre pays">🌍 Autre pays</option>
    </select>

    <label for="telephone">Numéro de téléphone</label>
    <div class="phone-row">
      <span class="phone-prefix" id="phonePrefix">+229</span>
      <input type="text" id="telephone" placeholder="Ex : 97 00 00 00" inputmode="numeric" autocomplete="tel-national">
    </div>

    <label for="classe">Classe</label>
    <select id="classe">
      <option value="">Choisis ta classe</option>
      <optgroup label="Collège">
        <option value="6ème">6ème</option>
        <option value="5ème">5ème</option>
        <option value="4ème">4ème</option>
        <option value="3ème">3ème</option>
      </optgroup>
      <optgroup label="Seconde">
        <option value="2nde A-B">2nde A-B</option>
        <option value="2nde C">2nde C</option>
        <option value="2nde D">2nde D</option>
      </optgroup>
      <optgroup label="Première">
        <option value="1ère A-B">1ère A-B</option>
        <option value="1ère C">1ère C</option>
        <option value="1ère D">1ère D</option>
      </optgroup>
      <optgroup label="Terminale">
        <option value="Tle A-B">Tle A-B</option>
        <option value="Tle C">Tle C</option>
        <option value="Tle D">Tle D</option>
      </optgroup>
    </select>
    <p class="error" id="formError">Merci de remplir ton prénom et ta classe.</p>

    <button class="primary" id="createBtn">Créer mon carnet →</button>
  </section>

  <!-- ===== Écran 2 : tableau de bord ===== -->
  <section id="dashboard" hidden>
    <div class="greet">
      <div>
        <h1 id="greetName">Bonjour 👋</h1>
        <span class="classe-pill" id="greetClasse">—</span>
      </div>
      <button class="edit-link" id="editBtn">Modifier</button>
    </div>

    <div class="streak-card">
      <div class="streak-top">
        <span class="streak-num" id="streakNum">0</span>
        <span class="streak-label">jour(s) consécutif(s)</span>
      </div>
      <div class="streak-sub" id="streakSub">Reviens chaque jour pour faire grandir ta série.</div>
      <button class="checkin-btn" id="checkinBtn">Je révise aujourd'hui</button>
    </div>

    <div class="stats-row">
      <div class="stat"><div class="num" id="pointsNum">0</div><div class="lbl">Points</div></div>
      <div class="stat"><div class="num" id="bestStreakNum">0</div><div class="lbl">Meilleure série</div></div>
    </div>

    <div class="section-title">Mes badges</div>
    <div class="badges" id="badgesGrid"></div>
  </section>

</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const STORAGE_KEY = 'cf_profile';

  const BADGES = [
    { id:'streak3',  icon:'🔥', name:'3 jours',  test:p => p.bestStreak >= 3 },
    { id:'streak7',  icon:'🌿', name:'7 jours',  test:p => p.bestStreak >= 7 },
    { id:'streak30', icon:'🏆', name:'30 jours', test:p => p.bestStreak >= 30 },
    { id:'pts50',    icon:'⭐', name:'50 pts',   test:p => p.points >= 50 },
    { id:'pts200',   icon:'💫', name:'200 pts',  test:p => p.points >= 200 },
    { id:'pts500',   icon:'👑', name:'500 pts',  test:p => p.points >= 500 },
  ];

  const $ = id => document.getElementById(id);

  function todayStr(d){
    d = d || new Date();
    return d.toISOString().slice(0,10);
  }
  function daysBetween(a, b){
    return Math.round((new Date(b) - new Date(a)) / 86400000);
  }

  function loadProfile(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function saveProfile(p){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
  }

  function showToast(msg){
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=> t.classList.remove('show'), 2200);
  }

  function renderBadges(p){
    const grid = $('badgesGrid');
    grid.innerHTML = '';
    BADGES.forEach(b => {
      const unlocked = b.test(p);
      const el = document.createElement('div');
      el.className = 'badge' + (unlocked ? ' unlocked' : '');
      el.innerHTML = `<div class="icon">${b.icon}</div><div class="name">${b.name}</div>`;
      grid.appendChild(el);
    });
  }

  function updatePhonePrefix(){
    const sel = $('pays');
    const opt = sel.options[sel.selectedIndex];
    $('phonePrefix').textContent = (opt && opt.value && opt.value !== 'autre') ? opt.value : '+___';
  }

  function renderDashboard(p){
    $('onboarding').hidden = true;
    $('dashboard').hidden = false;

    $('greetName').textContent = `Bonjour, ${p.prenom} 👋`;
    $('greetClasse').textContent = p.classe;
    $('streakNum').textContent = p.streak;
    $('pointsNum').textContent = p.points;
    $('bestStreakNum').textContent = p.bestStreak;

    const doneToday = p.lastCheckin === todayStr();
    $('checkinBtn').disabled = doneToday;
    $('checkinBtn').textContent = doneToday ? "C'est fait pour aujourd'hui ✓" : "Je révise aujourd'hui";
    $('streakSub').textContent = doneToday
      ? "Bien joué, reviens demain pour continuer ta série."
      : "Reviens chaque jour pour faire grandir ta série.";

    renderBadges(p);
  }

  function checkin(){
    const p = loadProfile();
    if (!p) return;
    const today = todayStr();
    if (p.lastCheckin === today) return;

    const gap = p.lastCheckin ? daysBetween(p.lastCheckin, today) : null;
    if (gap === 1){
      p.streak += 1;
    } else {
      p.streak = 1;
    }
    p.bestStreak = Math.max(p.bestStreak || 0, p.streak);
    p.points += 10;
    p.lastCheckin = today;

    const before = BADGES.filter(b => b.test({...p, streak:p.streak-1})).map(b=>b.id);
    saveProfile(p);
    renderDashboard(p);

    const newlyUnlocked = BADGES.filter(b => b.test(p) && !before.includes(b.id));
    if (newlyUnlocked.length){
      showToast(`Nouveau badge débloqué : ${newlyUnlocked[0].name} !`);
    } else {
      showToast('+10 points — série continuée !');
    }
  }

  function createProfile(){
    const nom = $('nom').value.trim();
    const prenom = $('prenom').value.trim();
    const paysSel = $('pays');
    const paysOpt = paysSel.options[paysSel.selectedIndex];
    const paysCode = paysSel.value;
    const paysNom = paysOpt ? paysOpt.dataset.nom : '';
    const telLocal = $('telephone').value.trim().replace(/[\s.-]/g, '');
    const classe = $('classe').value;

    const telValide = /^[0-9]{6,10}$/.test(telLocal);

    if (!nom || !prenom || !paysCode || !telValide || !classe){
      $('formError').style.display = 'block';
      return;
    }
    $('formError').style.display = 'none';

    const indicatif = paysCode === 'autre' ? '' : paysCode;
    const p = {
      nom, prenom, classe,
      pays: paysNom,
      telephone: indicatif ? `${indicatif} ${telLocal}` : telLocal,
      points: 0,
      streak: 0,
      bestStreak: 0,
      lastCheckin: null
    };
    saveProfile(p);
    renderDashboard(p);
  }

  function editProfile(){
    $('dashboard').hidden = true;
    $('onboarding').hidden = false;
    const p = loadProfile();
    if (p){
      $('nom').value = p.nom || '';
      $('prenom').value = p.prenom || '';
      $('classe').value = p.classe;
      if (p.telephone){
        const parts = p.telephone.split(' ');
        const code = parts[0];
        const rest = parts.slice(1).join(' ');
        const match = [...$('pays').options].find(o => o.value === code);
        if (match){
          $('pays').value = code;
          $('telephone').value = rest;
        } else {
          $('pays').value = 'autre';
          $('telephone').value = p.telephone;
        }
        updatePhonePrefix();
      }
    }
  }

  $('createBtn').addEventListener('click', createProfile);
  $('checkinBtn').addEventListener('click', checkin);
  $('editBtn').addEventListener('click', editProfile);
  $('pays').addEventListener('change', updatePhonePrefix);
  updatePhonePrefix();

  const existing = loadProfile();
  if (existing && existing.prenom && existing.classe){
    renderDashboard(existing);
  }
})();
</script>

</body>
</html>
