<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Connexion - Campus Flex</title>
  <meta name="theme-color" content="#2c3e8c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="pwa-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap">

  <!-- Firebase : ordre obligatoire -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>

  <style>
    :root{
      --bg:#FFFFFF; --paper:#F4F8FD; --grid:#D3DEF1; --ink:#2c3e8c; --text:#14203F; --muted:#46547A;
      --line:#AEBBDA; --btn-bg:#2c3e8c; --btn-fg:#FFFFFF; --card:#FFFFFF;
      --ok:#1B7A3E; --err:#B3261E; --amber:#f39c12;
    }
    @media (prefers-color-scheme:dark){
      :root{
        --bg:#0E1630; --paper:#16213F; --grid:#243256; --ink:#A9BEFF; --text:#E8EDFB; --muted:#A3B0D2;
        --line:#3F507F; --btn-bg:#A9BEFF; --btn-fg:#0E1630; --card:#0E1630;
        --ok:#6FD39A; --err:#FF8A80;
      }
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:flex;flex-direction:column;color:var(--text);
      font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;
      background-color:var(--paper);
      background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
      background-size:30px 30px}
    :focus-visible{outline:3px solid var(--amber);outline-offset:3px}

    .barre{background:#2c3e8c;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .marque{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:800;font-size:1.15rem;letter-spacing:-.01em}
    .marque img{width:34px;height:34px;border-radius:8px;display:block}
    .barre a.lien{color:#fff;font-weight:600;font-size:.95rem;text-decoration:none;padding:10px 2px}
    .barre a:focus-visible{outline-color:#fff}

    main{flex:1;width:100%;max-width:460px;margin:0 auto;padding:28px 20px 40px}
    .accueil{font-family:Caveat,"Segoe Print","Bradley Hand",cursive;font-weight:600;font-size:clamp(2rem,9vw,2.6rem);line-height:1.1;color:var(--ink);margin-bottom:14px}

    .carte{background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:24px 20px}
    h1{font-size:1.6rem;line-height:1.15;letter-spacing:-.02em;font-weight:800;color:var(--ink);margin-bottom:6px}
    .intro{color:var(--muted);margin-bottom:22px}

    label{display:block;margin-bottom:7px;font-weight:700}
    input{width:100%;min-height:52px;padding:12px 14px;margin-bottom:18px;border:2px solid var(--line);border-radius:10px;
      background:var(--card);color:var(--text);font:inherit;font-size:16px}
    input::placeholder{color:var(--muted);opacity:.8}
    input:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px rgba(243,156,18,.45)}

    .champ-mdp{position:relative}
    .champ-mdp input{padding-right:104px}
    .oeil{position:absolute;right:4px;top:4px;height:44px;min-width:92px;padding:0 12px;border:0;background:transparent;
      color:var(--ink);font:inherit;font-size:.95rem;font-weight:700;cursor:pointer;border-radius:8px}

    .mot-de-passe-oublie{display:block;margin:-6px 0 18px auto;min-height:44px;padding:0 4px;background:none;border:0;
      color:var(--ink);font:inherit;font-size:.95rem;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

    .btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;padding:12px 24px;border-radius:10px;
      font:inherit;font-weight:700;text-decoration:none;cursor:pointer;border:2px solid var(--btn-bg)}
    .btn-main{background:var(--btn-bg);color:var(--btn-fg)}
    .btn-alt{background:transparent;color:var(--ink)}
    .btn:disabled{opacity:.6;cursor:not-allowed}

    #message{margin-top:16px;padding:12px 14px;border-radius:6px;background:var(--paper);font-weight:600;line-height:1.45}
    #message:empty{display:none}
    #message.ok{border-left:5px solid var(--ok)}
    #message.err{border-left:5px solid var(--err)}

    .autre{margin-top:26px;text-align:center}
    .autre p{color:var(--muted);margin-bottom:10px}
    .retour{display:inline-block;margin-top:14px;padding:10px 6px;color:var(--ink);font-weight:600;text-decoration:none}
  </style>
</head>

<body>

  <header class="barre">
    <a class="marque" href="index.html"><img src="logo-icone.png" alt="">Campus Flex</a>
    <a class="lien" href="inscription.html">S’inscrire</a>
  </header>

  <main>

    <p class="accueil">Content de te revoir !</p>

    <div class="carte">
      <h1>Connexion</h1>
      <p class="intro">Connecte-toi pour accéder à la plateforme.</p>

      <form id="connexionForm">

        <label for="email">Adresse e-mail</label>
        <input
          type="email"
          id="email"
          placeholder="Exemple : vous@email.com"
          autocomplete="email"
          autocapitalize="none"
          required
        >

        <label for="motDePasse">Mot de passe</label>
        <div class="champ-mdp">
          <input
            type="password"
            id="motDePasse"
            placeholder="Ton mot de passe"
            autocomplete="current-password"
            required
          >
          <button type="button" id="btnOeil" class="oeil" aria-label="Afficher le mot de passe" aria-pressed="false">Afficher</button>
        </div>

        <button type="button" class="mot-de-passe-oublie" id="btnMotDePasseOublie">Mot de passe oublié ?</button>

        <button type="submit" id="btnConnexion" class="btn btn-main">Se connecter</button>

      </form>

      <div id="message" role="status" aria-live="polite"></div>
    </div>

    <div class="autre">
      <p>Tu n’as pas encore de compte ?</p>
      <a href="inscription.html" class="btn btn-alt">Créer un compte</a>
      <a href="index.html" class="retour">← Retour à l’accueil</a>
    </div>

  </main>

  <script>
    const formulaire = document.getElementById("connexionForm");
    const message = document.getElementById("message");
    const bouton = document.getElementById("btnConnexion");

    let enCoursDeConnexion = false;

    function afficherMessage(texte, type) {
      message.textContent = texte;
      message.className = texte ? (type === "success" ? "ok" : "err") : "";
    }

    function estAdministrateur(user) {
      if (!firebase.database) {
        throw new Error("Realtime Database non disponible");
      }

      return firebase.database()
        .ref("administrateurs/" + user.uid)
        .once("value")
        .then(function(snap) {
          return !!(snap && snap.exists());
        });
    }

    function refuserConnexion(texte) {
      return firebase.auth().signOut().then(function() {
        enCoursDeConnexion = false;
        bouton.disabled = false;
        bouton.textContent = "Se connecter";
        afficherMessage(texte, "error");
      });
    }

    function orienterNonAdmin(user) {
      const d = firebase.database();
      return Promise.all([
        d.ref("enseignants/" + user.uid).once("value"),
        d.ref("suspensions/" + user.uid).once("value")
      ]).then(function(r) {
        const prof = r[0].val();

        if (prof) {
          if (prof.statut === "actif") {
            afficherMessage("✅ Connexion réussie ! Redirection vers ton espace enseignant...", "success");
            setTimeout(function() { window.location.href = "enseignant.html"; }, 800);
            return;
          }
          if (prof.statut === "en_attente") {
            return refuserConnexion("⏳ Ton inscription est en attente de validation par l'administrateur.");
          }
          if (prof.statut === "suspendu") {
            return refuserConnexion("⛔ Ton compte enseignant est suspendu. Contacte l'administrateur.");
          }
          return refuserConnexion("❌ Ta demande d'inscription n'a pas été acceptée.");
        }

        if (r[1].exists()) {
          return refuserConnexion("⛔ Ton compte est suspendu. Contacte l'administration.");
        }

        afficherMessage("✅ Connexion réussie ! Redirection vers tes cours...", "success");
        setTimeout(function() { window.location.href = "maths/index.html"; }, 800);
      });
    }

    if (window.location.search.indexOf("suspendu=1") >= 0) {
      afficherMessage("⛔ Ton compte est suspendu. Contacte l'administration.", "error");
    }

    const btnMotDePasseOublie = document.getElementById("btnMotDePasseOublie");
    let enCoursDeReinitialisation = false;

    btnMotDePasseOublie.addEventListener("click", function() {
      if (enCoursDeReinitialisation) {
        return;
      }

      const email = document.getElementById("email").value.trim();

      if (!email) {
        afficherMessage(
          "✏️ Écris d'abord ton adresse e-mail ci-dessus, puis clique à nouveau sur « Mot de passe oublié ? ».",
          "error"
        );
        document.getElementById("email").focus();
        return;
      }

      enCoursDeReinitialisation = true;
      const texteOriginal = btnMotDePasseOublie.textContent;
      btnMotDePasseOublie.textContent = "Envoi en cours...";
      afficherMessage("", "success");

      firebase.auth()
        .sendPasswordResetEmail(email)
        .then(function() {
          afficherMessage(
            "📩 Un lien de réinitialisation a été envoyé à " + email +
            ". Ouvre ta boîte mail (et les spams) pour choisir un nouveau mot de passe.",
            "success"
          );
        })
        .catch(function(erreur) {
          console.error("Erreur réinitialisation :", erreur);

          let texte = "❌ Impossible d'envoyer l'e-mail de réinitialisation.";

          if (erreur.code === "auth/user-not-found") {
            texte = "❌ Aucun compte ne correspond à cette adresse e-mail.";
          } else if (erreur.code === "auth/invalid-email") {
            texte = "❌ Adresse e-mail invalide.";
          } else if (erreur.code === "auth/too-many-requests") {
            texte = "❌ Trop de demandes. Attends quelques minutes puis réessaie.";
          }

          afficherMessage(texte, "error");
        })
        .finally(function() {
          enCoursDeReinitialisation = false;
          btnMotDePasseOublie.textContent = texteOriginal;
        });
    });

    formulaire.addEventListener("submit", function(e) {
      e.preventDefault();

      if (enCoursDeConnexion) {
        return;
      }
      enCoursDeConnexion = true;

      const email = document.getElementById("email").value.trim();
      const motDePasse = document.getElementById("motDePasse").value;

      bouton.disabled = true;
      bouton.textContent = "Connexion...";
      afficherMessage("", "success");

      firebase.auth()
        .signInWithEmailAndPassword(email, motDePasse)
        .then(function(userCredential) {
          const user = userCredential.user;

          return estAdministrateur(user)
            .then(function(admin) {
              localStorage.setItem("lastActivity", Date.now().toString());
              if (admin) {
                // Un administrateur qui est aussi enseignant actif arrive dans son espace enseignant
                // (le lien « Administration » y est disponible) ; sinon, direction l'administration.
                return firebase.database().ref("enseignants/" + user.uid + "/statut").once("value").then(function(st) {
                  const aussiEnseignant = st.val() === "actif";
                  afficherMessage(aussiEnseignant ? "✅ Connexion réussie ! Redirection vers ton espace enseignant..." : "✅ Connexion réussie ! Redirection vers l'administration...", "success");
                  setTimeout(function() {
                    window.location.href = aussiEnseignant ? "enseignant.html" : "admin.html";
                  }, 800);
                }).catch(function() {
                  setTimeout(function() { window.location.href = "admin.html"; }, 800);
                });
              } else {
                return orienterNonAdmin(user);
              }
            });
        })
        .catch(function(erreur) {
          console.error("Erreur connexion :", erreur);
          enCoursDeConnexion = false;

          let texte = "❌ Adresse e-mail ou mot de passe incorrect.";

          if (erreur.code === "auth/user-not-found") {
            texte = "❌ Aucun compte ne correspond à cette adresse e-mail.";
          } else if (erreur.code === "auth/wrong-password") {
            texte = "❌ Mot de passe incorrect.";
          } else if (erreur.code === "auth/invalid-credential") {
            texte = "❌ Adresse e-mail ou mot de passe incorrect.";
          } else if (erreur.code === "auth/invalid-email") {
            texte = "❌ Adresse e-mail invalide.";
          }

          afficherMessage(texte, "error");
          bouton.disabled = false;
          bouton.textContent = "Se connecter";
        });
    });
      (function() {
      var champ = document.getElementById("motDePasse");
      var oeil = document.getElementById("btnOeil");
      if (!champ || !oeil) return;
      oeil.addEventListener("click", function() {
        var visible = champ.type === "text";
        champ.type = visible ? "password" : "text";
        oeil.textContent = visible ? "Afficher" : "Masquer";
        oeil.setAttribute("aria-pressed", visible ? "false" : "true");
        oeil.setAttribute("aria-label", visible ? "Afficher le mot de passe" : "Masquer le mot de passe");
        champ.focus();
      });
    })();
    </script>

</body>
</html>
