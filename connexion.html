<!DOCTYPE html><html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Connexion - MathsAvecMoi</title>  <!-- Firebase -->  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>  <script src="firebase-config.js"></script>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 35px 25px;
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,.12);
    }

    h1 {
      text-align: center;
      color: #2c3e8c;
      margin-bottom: 10px;
    }

    .intro {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 17px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2c3e8c;
    }

    button {
      width: 100%;
      padding: 13px;
      background: #2c3e8c;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .inscription {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }

    .inscription a {
      color: #f39c12;
      font-weight: bold;
      text-decoration: none;
    }

    .retour {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #666;
      text-decoration: none;
      font-size: 14px;
    }
  </style></head><body>  <div class="container"><h1>📐 MathsAvecMoi</h1>

<p class="intro">
  Connecte-toi pour accéder à ta plateforme.
</p>

<form id="connexionForm">

  <label for="email">Adresse e-mail</label>

  <input
    type="email"
    id="email"
    placeholder="Exemple : vous@email.com"
    required
  >

  <label for="motDePasse">Mot de passe</label>

  <input
    type="password"
    id="motDePasse"
    placeholder="Ton mot de passe"
    required
  >

  <button type="submit" id="btnConnexion">
    Se connecter
  </button>

</form>

<div id="message"></div>

<p class="inscription">
  Tu n'as pas encore de compte ?
  <a href="inscription.html">Créer un compte</a>
</p>

<a href="index.html" class="retour">
  ← Retour à l'accueil
</a>

  </div>  <script>
    const formulaire = document.getElementById("connexionForm");
    const message = document.getElementById("message");
    const bouton = document.getElementById("btnConnexion");

    formulaire.addEventListener("submit", function(e) {
      e.preventDefault();

      const email = document
        .getElementById("email")
        .value
        .trim();

      const motDePasse = document
        .getElementById("motDePasse")
        .value;

      bouton.disabled = true;
      bouton.textContent = "Connexion...";

      firebase.auth()
        .signInWithEmailAndPassword(email, motDePasse)
        .then(function() {

          message.textContent =
            "✅ Connexion réussie ! Redirection...";

          message.style.color = "#27ae60";

          setTimeout(function() {
            window.location.href = "accueil.html";
          }, 800);

        })
        .catch(function(erreur) {

          let texte = "❌ Adresse e-mail ou mot de passe incorrect.";

          if (erreur.code === "auth/user-not-found") {
            texte = "❌ Aucun compte ne correspond à cette adresse e-mail.";
          }

          if (erreur.code === "auth/wrong-password") {
            texte = "❌ Mot de passe incorrect.";
          }

          if (erreur.code === "auth/invalid-credential") {
            texte = "❌ Adresse e-mail ou mot de passe incorrect.";
          }

          message.textContent = texte;
          message.style.color = "#c0392b";

          bouton.disabled = false;
          bouton.textContent = "Se connecter";
        });
    });
  </script></body>
</html>
