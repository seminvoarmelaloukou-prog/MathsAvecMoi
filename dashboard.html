<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord — Campus Flex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
  :root{
    --ink:#1B2B22;
    --paper:#F5F1E4;
    --card:#FFFFFF;
    --forest:#2F6F4E;
    --forest-dark:#1F4E36;
    --amber:#E8A33D;
    --line:#DCD5C1;
    --muted:#6B7568;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  nav{
    background-color:#2c3e8c;
    padding:14px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:100;
  }
  nav h1{
    color:#fff;
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:1.05rem;
  }
  .wrap{ max-width:900px; margin:0 auto; padding:0 18px; }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:26px 22px;
    margin-top:24px;
  }
  .card h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:1.4rem;
    margin:0 0 16px;
  }
  input[type=password]{
    width:100%;
    padding:12px 13px;
    border:1.5px solid var(--line);
    border-radius:9px;
    font-size:1rem;
    background:#FCFAF4;
    color:var(--ink);
  }
  button.primary{
    width:100%;
    margin-top:16px;
    padding:14px;
    border:none;
    border-radius:9px;
    background:var(--forest);
    color:#fff;
    font-weight:600;
    font-size:1rem;
    cursor:pointer;
  }
  .error{ color:#B3401F; font-size:.85rem; margin-top:8px; display:none; }

  .stats-row{
    display:flex;
    gap:12px;
    margin-top:20px;
    flex-wrap:wrap;
  }
  .stat{
    flex:1;
    min-width:120px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 12px;
    text-align:center;
  }
  .stat .num{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:1.4rem;
    color:var(--forest-dark);
  }
  .stat .lbl{ font-size:.72rem; color:var(--muted); margin-top:2px; }

  .filter-row{
    display:flex;
    gap:8px;
    margin-top:20px;
    flex-wrap:wrap;
  }
  .filter-btn{
    padding:8px 14px;
    border:1.5px solid var(--line);
    border-radius:20px;
    background:#fff;
    font-size:.82rem;
    cursor:pointer;
  }
  .filter-btn.active{
    background:var(--forest);
    color:#fff;
    border-color:var(--forest);
  }

  table{
    width:100%;
    border-collapse:collapse;
    margin-top:16px;
    background:#fff;
    border-radius:12px;
    overflow:hidden;
  }
  th, td{
    padding:10px 8px;
    text-align:left;
    font-size:.85rem;
    border-bottom:1px solid var(--line);
  }
  th{
    background:#EFEAD8;
    color:var(--forest-dark);
    font-size:.72rem;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  tr:last-child td{ border-bottom:none; }
  .classe-tag{
    display:inline-block;
    padding:2px 9px;
    background:#EAF2ED;
    color:var(--forest-dark);
    border-radius:20px;
    font-size:.72rem;
    font-weight:600;
  }
  .stale{ color:#B3401F; font-weight:600; }
  [hidden]{ display:none !important; }

  .btn-whatsapp{
    background:#25D366;
    color:#fff;
    border:none;
    padding:6px 12px;
    border-radius:6px;
    cursor:pointer;
    font-size:.78rem;
    white-space:nowrap;
  }
  .btn-whatsapp:hover{ background:#1ebe5d; }
  .btn-whatsapp:disabled{
    background:#C9C4B4;
    cursor:not-allowed;
  }
</style>
</head>
<body>

<nav><h1>📐 MathsAvecMoi — Suivi enseignant</h1></nav>

<div class="wrap">

  <section id="login" class="card">
    <h1>Accès enseignant</h1>
    <input type="password" id="pwdInput" placeholder="Mot de passe">
    <p class="error" id="pwdError">Mot de passe incorrect.</p>
    <button class="primary" id="pwdBtn">Entrer</button>
  </section>

  <section id="board" hidden>
    <div class="stats-row">
      <div class="stat"><div class="num" id="totalEleves">0</div><div class="lbl">Élèves inscrits</div></div>
      <div class="stat"><div class="num" id="actifsAuj">0</div><div class="lbl">Actifs aujourd'hui</div></div>
      <div class="stat"><div class="num" id="moyPoints">0</div><div class="lbl">Points moyens</div></div>
    </div>

    <div class="filter-row" id="filterRow">
      <button class="filter-btn active" data-classe="">Toutes classes</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Nom</th>
          <th>Classe</th>
          <th>Points</th>
          <th>Série</th>
          <th>Dernier passage</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </section>

</div>

<script>
(function(){
  const MOT_DE_PASSE = "campusflex2026"; // <-- change-le ici si tu veux

  const $ = id => document.getElementById(id);
  let tousLesEleves = [];
  let classeActive = "";

  function todayStr(){ return new Date().toISOString().slice(0,10); }

  function joursDepuis(dateStr){
    if (!dateStr) return null;
    return Math.round((new Date(todayStr()) - new Date(dateStr)) / 86400000);
  }

  // Nettoie un numéro pour le format attendu par wa.me : chiffres uniquement, sans "+"
  function formaterNumeroWhatsApp(telephone){
    if (!telephone) return null;
    return telephone.replace(/[^0-9]/g, '');
  }

  function contacterWhatsApp(telephone, prenom){
    const numero = formaterNumeroWhatsApp(telephone);
    if (!numero){
      alert("Numéro introuvable pour cet élève.");
      return;
    }
    const message = `Bonjour ${prenom || ''}, ici ton enseignant de Campus Flex. J'espère que tes révisions se passent bien !`;
    const url = `https://wa.me/${numero}?text=${encodeURIComponent(message)}`;
    window.open(url, '_blank');
  }
  // Rendue accessible depuis les attributs onclick générés dynamiquement
  window.contacterWhatsApp = contacterWhatsApp;

  function chargerDonnees(){
    db.ref('eleves').once('value').then(snap => {
      const data = snap.val() || {};
      // La clé de chaque nœud est le numéro de téléphone : on la récupère
      // même si le champ "telephone" n'est pas dupliqué dans l'objet.
      tousLesEleves = Object.entries(data).map(([tel, e]) => ({
        ...e,
        telephone: e.telephone || tel
      }));
      construireFiltres();
      afficherTableau();
      afficherStats();
    }).catch(e => {
      console.error("Erreur de chargement", e);
    });
  }

  function construireFiltres(){
    const classes = [...new Set(tousLesEleves.map(e => e.classe).filter(Boolean))].sort();
    const row = $('filterRow');
    row.innerHTML = '<button class="filter-btn active" data-classe="">Toutes classes</button>';
    classes.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn';
      btn.dataset.classe = c;
      btn.textContent = c;
      row.appendChild(btn);
    });
    row.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        row.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        classeActive = btn.dataset.classe;
        afficherTableau();
      });
    });
  }

  function afficherStats(){
    $('totalEleves').textContent = tousLesEleves.length;
    const actifs = tousLesEleves.filter(e => e.lastCheckin === todayStr()).length;
    $('actifsAuj').textContent = actifs;
    const moy = tousLesEleves.length
      ? Math.round(tousLesEleves.reduce((s,e) => s + (e.points||0), 0) / tousLesEleves.length)
      : 0;
    $('moyPoints').textContent = moy;
  }

  function afficherTableau(){
    const liste = classeActive
      ? tousLesEleves.filter(e => e.classe === classeActive)
      : tousLesEleves;

    liste.sort((a,b) => (b.points||0) - (a.points||0));

    const tbody = $('tbody');
    tbody.innerHTML = '';
    liste.forEach(e => {
      const gap = joursDepuis(e.lastCheckin);
      const staleClass = (gap !== null && gap >= 3) ? 'stale' : '';
      const dernierTexte = e.lastCheckin
        ? (gap === 0 ? "Aujourd'hui" : `il y a ${gap} j`)
        : "Jamais";

      const numero = formaterNumeroWhatsApp(e.telephone);
      const prenomEch = (e.prenom || '').replace(/'/g, "\\'");

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${e.prenom || ''} ${e.nom || ''}</td>
        <td><span class="classe-tag">${e.classe || '—'}</span></td>
        <td>${e.points || 0}</td>
        <td>${e.streak || 0} (max ${e.bestStreak || 0})</td>
        <td class="${staleClass}">${dernierTexte}</td>
        <td>
          <button class="btn-whatsapp" ${numero ? '' : 'disabled'}
            onclick="contacterWhatsApp('${e.telephone || ''}', '${prenomEch}')">
            📱 Contacter
          </button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  $('pwdBtn').addEventListener('click', () => {
    if ($('pwdInput').value === MOT_DE_PASSE){
      $('login').hidden = true;
      $('board').hidden = false;
      sessionStorage.setItem('cf_teacher_ok', '1');
      chargerDonnees();
    } else {
      $('pwdError').style.display = 'block';
    }
  });

  $('pwdInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') $('pwdBtn').click();
  });

  if (sessionStorage.getItem('cf_teacher_ok') === '1'){
    $('login').hidden = true;
    $('board').hidden = false;
    chargerDonnees();
  }
})();
</script>

</body>
</html>
