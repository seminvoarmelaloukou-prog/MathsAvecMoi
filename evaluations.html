<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Évaluation - Campus Flex</title>
<meta name="theme-color" content="#2c3e8c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="pwa-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>

<link rel="stylesheet" href="campus.css">
<link rel="stylesheet" href="campus-menu.css">
<script src="campus-menu.js" defer></script>
<style>
.badge-tentative,.tentative-badge{display:inline-block;background:var(--hl);color:var(--ink);border:2px solid var(--amber);padding:5px 14px;border-radius:999px;font-size:.9rem;font-weight:800;margin:6px 0 4px}
.hero{text-align:left}
.hero p{color:var(--muted);margin-top:8px}
.progression{position:sticky;top:0;z-index:5;background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:10px 14px;margin-bottom:16px;font-weight:700;font-size:.95rem}
.progression[hidden]{display:none}
.progression .barre-fond{height:10px;background:var(--line);border-radius:999px;margin-top:8px;overflow:hidden}
.progression .barre-fait{height:100%;width:0;background:var(--amber);border-radius:999px;transition:width .3s ease}
.question-card{background:var(--card);border:2px solid var(--line);border-left:5px solid var(--ink);border-radius:6px;padding:18px 16px;margin-bottom:16px;animation:pop .35s ease both}
.question-card h3{color:var(--ink);font-size:1.05rem;margin-bottom:8px}
.question-card p{margin-bottom:12px;line-height:1.5;overflow-wrap:anywhere}
.question-card img{max-width:100%;height:auto;border-radius:6px;margin:8px 0}
.choix{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.choix label{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px;border:2px solid var(--line);border-radius:10px;font-weight:600;cursor:pointer;margin:0;line-height:1.35}
.choix input{width:22px;height:22px;flex:none;accent-color:var(--ink)}
.choix label:has(input:checked){border-color:var(--ink);background:var(--hl)}
.actions{margin:20px 0;text-align:center}
.actions .btn,.actions button{width:100%}
#resultat{margin-top:22px;background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:22px 18px;text-align:center;display:none;animation:pop .4s ease both}
#resultat h3{color:var(--ink);font-size:1.3rem;margin-bottom:8px}
#texteResultat{font-size:1.4rem;font-weight:800;color:var(--ink)}
</style>
</head>
<body>
<header class="barre">
  <div class="barre-haut">
    <a class="marque" href="index.html"><img data-garder src="logo-icone.png" alt="">Campus Flex</a>
    <button class="burger" id="burger" type="button" aria-expanded="false" aria-controls="menu-principal" aria-label="Ouvrir le menu"><span></span><span></span><span></span></button>
  </div>
  <div class="menu-panneau" id="menu-principal" role="navigation" aria-label="Navigation principale">
    <div class="interieur"><div class="liens">
        <a href="profil.html">Mon profil</a>
        <a href="matieres.html">Matières</a>
        <a href="composition.html">Composer</a>
        <a href="echanges.html">Échanges</a>
        <a href="emploi-eleve.html">Emploi du temps</a>
        <a href="bulletin.html">Mon bulletin</a>
        <a href="mes-resultats.html">Mes résultats</a>
        <a href="index.html">Accueil</a>
        <a href="#" class="sortie" data-deconnexion>Se déconnecter</a>
    </div></div>
  </div>
</header>

<main>

  <section class="carte hero">
    <h2 id="titreEval">Évaluation</h2>

    <div id="tentativeBadge" class="tentative-badge">
      Chargement de la tentative…
    </div>

    <p id="infoEval">
      Chargement de l’évaluation…
    </p>
  </section>

  <div id="progression" class="progression" hidden aria-live="polite">
    <span id="progression-texte"></span>
    <div class="barre-fond"><div class="barre-fait" id="progression-barre"></div></div>
  </div>

  <div id="questionsContainer">
    <!-- Questions injectées par JS -->
  </div>

  <div class="actions">
    <button id="btnEnvoyer" class="btn" disabled>Envoyer mes réponses</button>
  </div>

  <div id="resultat">
    <h3>Résultat</h3>
    <p id="texteResultat"></p>
  </div>

  <div class="actions">
    <a href="profil.html" class="btn sec">← Retour à mon profil</a>
  </div>

</main>
<footer>© 2026 Campus Flex - Tous droits réservés - <a href="contact.html">Contact</a></footer>
<script>
    const titreEval = document.getElementById("titreEval");
    const tentativeBadge = document.getElementById("tentativeBadge");
    const infoEval = document.getElementById("infoEval");
    const questionsContainer = document.getElementById("questionsContainer");
    const btnEnvoyer = document.getElementById("btnEnvoyer");
    const resultatDiv = document.getElementById("resultat");
    const texteResultat = document.getElementById("texteResultat");

    let userActuel = null;
    let classeEleve = null;
    let typeEval = null; // "blanche" ou "officielle"
    let questions = [];
    let reponses = {};

    function getTypeFromURL() {
      const params = new URLSearchParams(window.location.search);
      return params.get("type"); // "blanche" ou "officielle"
    }

    function getClasseFromURL() {
      const params = new URLSearchParams(window.location.search);
      return params.get("classe"); // "6e", "5e", etc.
    }

    window.addEventListener("load", function() {
      if (!firebase.auth || !firebase.database) {
        infoEval.textContent = "Service non disponible pour le moment.";
        tentativeBadge.style.display = "none";
        return;
      }

      firebase.auth().onAuthStateChanged(function(user) {
        if (!user) {
          window.location.href = "connexion.html";
          return;
        }

        userActuel = user;

        // Récupérer la classe de l'élève depuis son profil
        firebase.database()
          .ref("eleves/" + user.uid)
          .once("value")
          .then(function(snap) {
            if (!snap || !snap.exists()) {
              infoEval.textContent = "Ton profil élève n’est pas complet.";
              tentativeBadge.style.display = "none";
              return;
            }

            const data = snap.val();
            classeEleve = data.classe || null;

            if (!classeEleve) {
              infoEval.textContent = "Ta classe n’est pas renseignée.";
              tentativeBadge.style.display = "none";
              return;
            }

            // Priorité à la classe dans l'URL (depuis maths/index.html)
            const classeURL = getClasseFromURL();
            if (classeURL && classeURL !== classeEleve) {
              // L'élève essaie de passer une évaluation qui n'est pas sa classe
              infoEval.textContent =
                "Cette évaluation n’est pas destinée à ta classe. Tu es inscrit en " +
                classeEleve + ".";
              tentativeBadge.style.display = "none";
              btnEnvoyer.disabled = true;
              return;
            }

            typeEval = getTypeFromURL();
            if (!typeEval || (typeEval !== "blanche" && typeEval !== "officielle")) {
              infoEval.textContent = "Type d’évaluation non valide.";
              tentativeBadge.style.display = "none";
              return;
            }

            chargerEvaluation();
          })
          .catch(function(err) {
            console.error("Erreur lecture profil élève :", err);
            infoEval.textContent = "Impossible de charger ton profil.";
            tentativeBadge.style.display = "none";
          });
      });
    });

    function chargerEvaluation() {
      const pathQuestions =
        (typeEval === "blanche"
          ? "evaluations_blanches/questions/"
          : "evaluations/questions/") + classeEleve;

      const baseResultatsPath =
        (typeEval === "blanche"
          ? "evaluations_blanches/resultats/"
          : "evaluations/resultats/");

      const pathResultat = baseResultatsPath + userActuel.uid;
      const maxTentatives = 3;

      tentativeBadge.textContent = "Vérification des tentatives…";
      tentativeBadge.style.display = "inline-block";

      firebase.database()
        .ref(pathQuestions)
        .once("value")
        .then(function(snapQuestions) {
          if (!snapQuestions || !snapQuestions.exists()) {
            tentativeBadge.style.display = "none";
            infoEval.textContent =
              "Aucune question disponible pour ta classe (" +
              classeEleve +
              ") pour le moment.";
            return null;
          }

          const data = snapQuestions.val();

          questions = Object.keys(data)
            .map(function(key) {
              const q = data[key];
              q.id = key;
              return q;
            })
            .filter(function(q) {
              return q.active !== false;
            });

          if (questions.length === 0) {
            tentativeBadge.style.display = "none";
            infoEval.textContent =
              "Aucune question active disponible pour ta classe (" +
              classeEleve +
              ") pour le moment.";
            return null;
          }

          return firebase.database()
            .ref(pathResultat)
            .once("value");
        })
        .then(function(snapResultats) {
          if (snapResultats === null) {
            return;
          }

          let nbTentatives = 0;

          if (snapResultats.exists()) {
            const resultats = snapResultats.val();

            /*
              On ne compte que les vraies tentatives.
              Ceci évite de compter un ancien résultat incomplet.
            */
            nbTentatives = Object.keys(resultats).filter(function(id) {
              const tentative = resultats[id];

              return tentative &&
                typeof tentative.score === "number" &&
                typeof tentative.totalPoints === "number" &&
                tentative.classe === classeEleve &&
                tentative.type === typeEval;
            }).length;
          }

          const numeroTentative = nbTentatives + 1;

          titreEval.textContent =
            (typeEval === "blanche"
              ? "Évaluation blanche"
              : "Évaluation officielle") +
            " – " +
            classeEleve;

          if (nbTentatives >= maxTentatives) {
            tentativeBadge.textContent =
              "Tentatives utilisées : " +
              nbTentatives +
              " / " +
              maxTentatives;

            infoEval.textContent =
              "Tu as atteint le nombre maximum de " +
              maxTentatives +
              " tentatives pour cette évaluation.";

            questionsContainer.innerHTML = "";
            btnEnvoyer.disabled = true;
            btnEnvoyer.textContent = "Limite atteinte";
            return;
          }

          tentativeBadge.textContent =
            "Tentative " +
            numeroTentative +
            " sur " +
            maxTentatives +
            " — " +
            nbTentatives +
            " tentative(s) déjà utilisée(s)";

          infoEval.textContent =
            "Réponds à toutes les questions puis envoie tes réponses.";

          afficherQuestions();
          btnEnvoyer.disabled = false;
          btnEnvoyer.textContent = "Envoyer mes réponses";
        })
        .catch(function(err) {
          console.error("Erreur chargement évaluation :", err);

          tentativeBadge.textContent = "Tentatives : indisponible";
          tentativeBadge.style.display = "inline-block";

          infoEval.textContent =
            "Impossible de charger l’évaluation pour le moment.";

          btnEnvoyer.disabled = true;
        });
    }

    function afficherQuestions() {
      questionsContainer.innerHTML = "";

      questions.forEach(function(q, index) {
        const card = document.createElement("div");
        card.className = "question-card";

        let html =
          "<h3>Question " + (index + 1) + "</h3>" +
          "<p>" + q.question + "</p>";

        if (q.image && q.image.trim() !== "") {
          html += "<img src='" + q.image + "' alt='Image question'>";
        }

        if (q.choix && q.choix.length > 0) {
          html += "<div class='choix'>";
          q.choix.forEach(function(choix, i) {
            html +=
              "<label>" +
              "<input type='radio' name='q_" + q.id + "' value='" + i + "'> " +
              choix +
              "</label>";
          });
          html += "</div>";
        }

        card.innerHTML = html;
        questionsContainer.appendChild(card);
      });
    }

    btnEnvoyer.addEventListener("click", function() {
      if (!userActuel || !classeEleve || !typeEval) {
        alert("Session non valide. Reconnecte-toi.");
        return;
      }

      reponses = {};
      let score = 0;
      let maxScore = 0;

      questions.forEach(function(q) {
        const nom = "q_" + q.id;
        const selected = document.querySelector("input[name='" + nom + "']:checked");
        const reponseIndex = selected ? parseInt(selected.value, 10) : null;

        reponses[q.id] = reponseIndex;

        maxScore += (q.points || 1);
        if (reponseIndex !== null && reponseIndex === q.bonneReponse) {
          score += (q.points || 1);
        }
      });

      const baseResultatsPath =
        (typeEval === "blanche"
          ? "evaluations_blanches/resultats/"
          : "evaluations/resultats/");

      const pathResultat = baseResultatsPath + userActuel.uid;

      // Compter à nouveau les tentatives au moment de l'envoi
      btnEnvoyer.disabled = true;
      btnEnvoyer.textContent = "Vérification…";

      firebase.database()
        .ref(pathResultat)
        .once("value")
        .then(function(snap) {
          let nbTentatives = 0;

          if (snap.exists()) {
            nbTentatives = Object.keys(snap.val()).length;
          }

          const maxTentatives = 3;

          if (nbTentatives >= maxTentatives) {
            btnEnvoyer.textContent = "Envoyer mes réponses";
            btnEnvoyer.disabled = false;
            alert(
              "Tu as déjà atteint le nombre maximum de " + maxTentatives + " tentatives pour cette évaluation. " +
              "Tu ne peux plus envoyer de nouvelle tentative."
            );
            throw new Error("LIMITE_TENTATIVES_ATTEINTE");
          }

          const idTentative = "tentative" + (nbTentatives + 1);

          // Champs alignés sur ce qu'attend la page admin-resultats.html :
          // date (et non datePassation), totalPoints (et non maxScore),
          // + nbQuestions ajouté.
          const objetResultat = {
            evaluationId: typeEval,
            classe: classeEleve,
            date: Date.now(),
            reponses: reponses,
            score: score,
            totalPoints: maxScore,
            nbQuestions: questions.length,
            type: typeEval
          };

          btnEnvoyer.textContent = "Enregistrement…";

          return firebase.database()
            .ref(pathResultat + "/" + idTentative)
            .set(objetResultat);
        })
        .then(function() {
          // Si on arrive ici, l'enregistrement a réussi
          btnEnvoyer.textContent = "Envoyé";
          afficherResultat(score, maxScore);
        })
        .catch(function(err) {
          if (err && err.message === "LIMITE_TENTATIVES_ATTEINTE") {
            // On a déjà affiché l'alerte, on ne fait rien de plus
            return;
          }

          console.error("Erreur enregistrement résultat :", err);
          btnEnvoyer.textContent = "Envoyer mes réponses";
          btnEnvoyer.disabled = false;
          alert("Une erreur est survenue lors de l’envoi de tes réponses.");
        });
    });

    function afficherResultat(score, maxScore) {
      resultatDiv.style.display = "block";
      texteResultat.textContent =
        "Ton score : " + score + " / " + maxScore + ".";
    }
  </script>

<!-- Avancement : nombre de questions répondues (lecture seule, ne touche pas aux réponses) -->
<script>
  (function () {
    var conteneur = document.getElementById("questionsContainer");
    var bloc = document.getElementById("progression");
    var texte = document.getElementById("progression-texte");
    var barre = document.getElementById("progression-barre");

    function maj() {
      var noms = {}, faits = {}, total = 0, fait = 0;
      conteneur.querySelectorAll("input[type=radio]").forEach(function (r) {
        noms[r.name] = true;
        if (r.checked) faits[r.name] = true;
      });
      total = Object.keys(noms).length;
      fait = Object.keys(faits).length;
      bloc.hidden = total === 0;
      if (!total) { return; }
      texte.textContent = fait + " question" + (fait > 1 ? "s" : "") + " répondue" + (fait > 1 ? "s" : "") + " sur " + total;
      barre.style.width = Math.round(fait * 100 / total) + "%";
    }

    conteneur.addEventListener("change", maj);
    new MutationObserver(maj).observe(conteneur, { childList: true });
  })();
</script>
</body>
</html>
