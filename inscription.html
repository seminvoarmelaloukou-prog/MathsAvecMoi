<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inscription - Campus Flex</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 35px 25px;
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,.12);
    }

    h1 {
      text-align: center;
      color: #2c3e8c;
      margin-bottom: 10px;
    }

    .intro {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 17px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2c3e8c;
    }

    button {
      width: 100%;
      padding: 13px;
      background: #f39c12;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .connexion {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }

    .connexion a {
      color: #2c3e8c;
      font-weight: bold;
      text-decoration: none;
    }

    .retour {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #666;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎓 Campus Flex</h1>

    <p class="intro">
      Crée ton compte pour accéder à la plateforme.
    </p>

    <form id="inscriptionForm">

      <label for="identifiant">Identifiant</label>

      <input
        type="text"
        id="identifiant"
        placeholder="Exemple : armel123"
        required
        minlength="3"
        maxlength="30"
      >

      <label for="email">Adresse e-mail</label>

      <input
        type="email"
        id="email"
        placeholder="Exemple : vous@email.com"
        required
      >

      <label for="motDePasse">Mot de passe</label>

      <input
        type="password"
        id="motDePasse"
        placeholder="Au moins 6 caractères"
        required
        minlength="6"
      >

      <label for="confirmation">Confirmer le mot de passe</label>

      <input
        type="password"
        id="confirmation"
        placeholder="Retape ton mot de passe"
        required
        minlength="6"
      >

      <button type="submit" id="btnInscription">
        Créer mon compte
      </button>

    </form>

    <div id="message"></div>

    <p class="connexion">
      Tu as déjà un compte ?
      <a href="connexion.html">Se connecter</a>
    </p>

    <a href="index.html" class="retour">
      ← Retour à l'accueil
    </a>

  </div>

  <script>
    const formulaire = document.getElementById("inscriptionForm");
    const message = document.getElementById("message");
    const bouton = document.getElementById("btnInscription");

    formulaire.addEventListener("submit", function(e) {

      e.preventDefault();

      const identifiant = document
        .getElementById("identifiant")
        .value
        .trim();

      const email = document
        .getElementById("email")
        .value
        .trim();

      const motDePasse = document
        .getElementById("motDePasse")
        .value;

      const confirmation = document
        .getElementById("confirmation")
        .value;

      /*
       * Vérification des mots de passe
       */
      if (motDePasse !== confirmation) {

        message.textContent =
          "❌ Les mots de passe ne correspondent pas.";

        message.style.color = "#c0392b";

        return;
      }

      /*
       * Désactiver le bouton pendant la création
       */
      bouton.disabled = true;
      bouton.textContent = "Création du compte...";

      /*
       * Création du compte Firebase
       */
      firebase.auth()
        .createUserWithEmailAndPassword(email, motDePasse)

        .then(function(resultat) {

          /*
           * Identifiant choisi par l'utilisateur
           */
          localStorage.setItem(
            "cf_identifiant",
            identifiant
          );

          /*
           * UID unique du compte Firebase
           *
           * Cet UID servira ensuite à sécuriser
           * le carnet et les résultats.
           */
          localStorage.setItem(
            "cf_uid",
            resultat.user.uid
          );

          message.textContent =
            "✅ Compte créé avec succès ! Redirection...";

          message.style.color = "#27ae60";

          /*
           * Redirection vers l'accueil
           */
          setTimeout(function() {

            window.location.href = "index.html";

          }, 1200);

        })

        .catch(function(erreur) {

          let texte =
            "❌ Une erreur est survenue.";

          if (
            erreur.code ===
            "auth/email-already-in-use"
          ) {

            texte =
              "❌ Cette adresse e-mail est déjà utilisée.";

          }

          if (
            erreur.code ===
            "auth/invalid-email"
          ) {

            texte =
              "❌ L'adresse e-mail n'est pas valide.";

          }

          if (
            erreur.code ===
            "auth/weak-password"
          ) {

            texte =
              "❌ Le mot de passe doit contenir au moins 6 caractères.";

          }

          message.textContent = texte;

          message.style.color = "#c0392b";

          bouton.disabled = false;

          bouton.textContent =
            "Créer mon compte";

        });

    });
  </script>

</body>
</html>
