<style>

:root{
  --ink:#1B2B22;
  --paper:#F5F1E4;
  --card:#FFFFFF;
  --forest:#2F6F4E;
  --forest-dark:#1F4E36;
  --amber:#E8A33D;
  --line:#DCD5C1;
  --muted:#6B7568;
  --red:#B3401F;
  --blue:#2c3e8c;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Work Sans',sans-serif;
  padding-bottom:60px;
}

/* ================= NAVIGATION ================= */

nav{
  background-color:var(--blue);
  padding:14px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:100;
}

nav h1{
  color:#fff;
  font-family:'Fraunces',serif;
  font-weight:700;
  font-size:1.05rem;
  margin:0;
}

.nav-toggle{
  display:none;
}

.nav-toggle-label{
  display:none;
  color:#fff;
  font-size:26px;
  cursor:pointer;
}

nav ul{
  list-style:none;
  display:flex;
  gap:18px;
  margin:0;
  padding:0;
}

nav ul li a{
  color:#fff;
  text-decoration:none;
  font-size:.85rem;
  padding-bottom:4px;
  border-bottom:2px solid transparent;
}

nav ul li a.active{
  border-color:#f39c12;
}

@media(max-width:640px){

  .nav-toggle-label{
    display:block;
  }

  nav ul{
    position:absolute;
    top:100%;
    left:0;
    right:0;
    background:#1e2c66;
    flex-direction:column;
    gap:0;
    max-height:0;
    overflow:hidden;
    transition:max-height .3s ease;
  }

  nav ul li{
    border-top:1px solid rgba(255,255,255,.1);
  }

  nav ul li a{
    display:block;
    padding:14px 20px;
  }

  .nav-toggle:checked ~ ul{
    max-height:400px;
  }
}

/* ================= CONTENEUR ================= */

.wrap{
  max-width:600px;
  margin:0 auto;
  padding:0 18px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:22px;
  margin-top:20px;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}

.card h1{
  font-family:'Fraunces',serif;
  font-size:1.3rem;
  margin:0 0 6px;
}

.card p.lead{
  color:var(--muted);
  font-size:.9rem;
  margin:0 0 16px;
}

/* ================= EPREUVES ================= */

.epreuve-btn{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#FCFAF4;
  border:1.5px solid var(--line);
  border-radius:10px;
  padding:14px 16px;
  margin-bottom:10px;
  cursor:pointer;
  font-family:'Work Sans',sans-serif;
  font-size:.95rem;
  text-align:left;
}

.epreuve-btn:hover{
  border-color:var(--forest);
  background:#F4F7F1;
}

.epreuve-btn:active{
  background:#EFEAD8;
}

.epreuve-info{
  display:block;
}

.epreuve-titre{
  font-weight:600;
}

.epreuve-details{
  display:block;
  color:var(--muted);
  font-size:.78rem;
  margin-top:4px;
}

.epreuve-arrow{
  color:var(--forest-dark);
  font-weight:600;
  font-size:1.2rem;
}

/* ================= QUESTION ================= */

.question-card{
  margin-top:18px;
}

.question-num{
  font-size:.75rem;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-bottom:8px;
}

.question-texte{
  font-weight:600;
  margin-bottom:14px;
  font-size:1.02rem;
  line-height:1.5;
}

/* IMAGE DE LA QUESTION */

.question-image{
  width:100%;
  max-height:350px;
  object-fit:contain;
  display:block;
  margin:12px auto 18px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#fafafa;
}

/* ================= CHOIX ================= */

.choix-option{
  display:block;
  background:#FCFAF4;
  border:1.5px solid var(--line);
  border-radius:9px;
  padding:12px 14px;
  margin-bottom:8px;
  cursor:pointer;
  font-size:.92rem;
  line-height:1.4;
}

.choix-option:hover{
  border-color:var(--forest);
}

.choix-option input{
  margin-right:10px;
  accent-color:var(--forest);
}

.choix-option.correct{
  border-color:var(--forest);
  background:#EAF2ED;
}

.choix-option.incorrect{
  border-color:var(--red);
  background:#FBEAE6;
}

.choix-image{
  display:block;
  width:100%;
  max-height:180px;
  object-fit:contain;
  margin-top:8px;
  border-radius:7px;
}

/* ================= BOUTONS ================= */

button.primary{
  width:100%;
  margin-top:20px;
  padding:14px;
  border:none;
  border-radius:9px;
  background:var(--forest);
  color:#fff;
  font-weight:600;
  font-size:1rem;
  cursor:pointer;
}

button.primary:hover{
  background:var(--forest-dark);
}

button.primary:disabled{
  opacity:.5;
  cursor:not-allowed;
}

button.secondary{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#FCFAF4;
  color:var(--ink);
  font-weight:600;
  cursor:pointer;
}

/* ================= CHRONOMETRE ================= */

.quiz-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.timer{
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  padding:7px 10px;
  border-radius:8px;
  background:#EEF2ED;
  color:var(--forest-dark);
}

.timer.warning{
  background:#FFF0D6;
  color:#9A5A00;
}

.timer.danger{
  background:#FBEAE6;
  color:var(--red);
}

/* ================= RESULTAT ================= */

.result-card{
  text-align:center;
  padding:30px 20px;
}

.result-score{
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  font-size:2.8rem;
  color:var(--forest-dark);
}

.result-note{
  font-size:1.3rem;
  margin-top:8px;
  font-weight:600;
}

.result-total{
  color:var(--muted);
  font-size:.95rem;
  margin-top:4px;
}

.result-msg{
  margin-top:14px;
  font-size:.95rem;
}

/* ================= CORRECTION ================= */

.correction{
  text-align:left;
  margin-top:25px;
}

.correction h2{
  font-family:'Fraunces',serif;
  font-size:1.15rem;
}

.correction-item{
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px;
  margin-bottom:10px;
}

.correction-item.good{
  background:#EAF2ED;
  border-color:var(--forest);
}

.correction-item.bad{
  background:#FBEAE6;
  border-color:var(--red);
}

.correction-question{
  font-weight:600;
  margin-bottom:6px;
}

.correction-reponse{
  font-size:.88rem;
  margin-top:4px;
}

/* ================= CLASSEMENT ================= */

.classement{
  text-align:left;
  margin-top:25px;
}

.classement h2{
  font-family:'Fraunces',serif;
  font-size:1.15rem;
}

.classement-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 12px;
  border-bottom:1px solid var(--line);
}

.classement-row:first-child{
  font-weight:600;
}

/* ================= UTILITAIRES ================= */

.loading{
  text-align:center;
  color:var(--muted);
  padding:15px;
}

.message{
  padding:12px;
  border-radius:8px;
  background:#FCFAF4;
  color:var(--muted);
  font-size:.9rem;
}

[hidden]{
  display:none !important;
}

</style>
</head>

<div class="wrap">

  <!-- ================= LISTE ================= -->

  <section

    </h1>

  <section
    id="quizSection"
    class="card"
    hidden
  >

    <div class="quiz-top">

      <div>

        <h1 id="quizTitre">
          —

        <p
          class="lead"
          id="quizProgress"

<script>

(function(){

  const $ = id => document.getElementById(id);

  const STORAGE_PROFILES = 'cf_profiles';
  const STORAGE_ACTIVE = 'cf_active';

  let profilActif = null;

  let epreuveActuelle = null;
  let epreuveActuelleId = null;

  let questionIndex = 0;
  let bonnesReponses = 0;

  let reponseValidee = false;

  let timerInterval = null;
  let tempsRestant = 0;

  let historiqueReponses = [];


  /* ============================================
     PROFIL ACTIF
  ============================================ */

  function chargerProfilActif(){

    const id =
      localStorage.getItem(STORAGE_ACTIVE);

    if(!id) return null;

    try{

      const raw =
        localStorage.getItem(STORAGE_PROFILES);

      const all =
        raw ? JSON.parse(raw) : {};

      return all[id] || null;

    }catch(e){

      console.error(e);

      return null;
    }
  }


  /* ============================================
     SAUVEGARDE PROFIL
  ============================================ */

  function sauvegarderProfil(p){

    try{

      const raw =
        localStorage.getItem(STORAGE_PROFILES);

      const all =
        raw ? JSON.parse(raw) : {};

      all[p.id] = p;

      localStorage.setItem(
        STORAGE_PROFILES,
        JSON.stringify(all)
      );

    }catch(e){

      console.error(e);
    }


    if(typeof db !== 'undefined'){

      db.ref('eleves/' + p.id)
        .update(p)
        .catch(e => console.error(e));

    }

  }


  /* ============================================
     UTILITAIRES IMAGE
  ============================================ */

  function obtenirImage(obj){

    if(!obj || typeof obj !== 'object'){
      return '';
    }

    return (
      obj.image ||
      obj.imageUrl ||
      obj.illustration ||
      obj.photo ||
      ''
    );

  }


  function afficherImage(url, classe){

    if(!url) return '';

    const safeUrl =
      String(url)
        .replace(/"/g, '&quot;');

    return `
      <img
        src="${safeUrl}"
        class="${classe}"
        alt="Illustration de la question"
        loading="lazy"
        onerror="this.style.display='none';"
      >
    `;

  }


  /* ============================================
     VERIFIER TENTATIVE
  ============================================ */

  function evaluationDejaFaite(id){

    if(!profilActif){
      return false;
    }

    const localKey =
      'cf_eval_' +
      profilActif.id +
      '_' +
      id;

    return localStorage.getItem(localKey) === '1';

  }


  function marquerEvaluationFaite(id){

    if(!profilActif) return;

    const localKey =
      'cf_eval_' +
      profilActif.id +
      '_' +
      id;

    localStorage.setItem(localKey,'1');

  }


  /* ============================================
     LISTE DES EPREUVES
  ============================================ */

  function chargerListeEpreuves(){

    if(!profilActif){

      $('listeLead').textContent =
        "Crée d'abord ton carnet dans Mon profil pour accéder aux évaluations.";

      return;
    }


    if(typeof db === 'undefined'){

      $('listeLead').textContent =
        "Erreur : connexion à la base de données impossible.";

      return;
    }


    db.ref(
      'epreuves/' +
      profilActif.classe
    )

    .once('value')

    .then(snap => {

      const data =
        snap.val() || {};

      const ids =
        Object.keys(data);


      if(ids.length === 0){

        $('listeLead').textContent =
          "Aucune évaluation disponible pour ta classe pour l'instant.";

        return;
      }


      $('listeLead').textContent =
        `Évaluations pour la classe ${profilActif.classe} :`;


      const container =
        $('listeContainer');

      container.innerHTML = '';


      ids.forEach(id => {

        const ep =
          data[id];

        const dejaFaite =
          evaluationDejaFaite(id);


        const btn =
          document.createElement('button');

        btn.type = 'button';

        btn.className =
          'epreuve-btn';


        const nbQuestions =
          ep.questions
            ? Object.keys(ep.questions).length
            : 0;


        const duree =
          Number(ep.duree || 0);


        btn.innerHTML = `

          <span class="epreuve-info">

            <span class="epreuve-titre">
              ${ep.titre || 'Évaluation'}
            </span>

            <span class="epreuve-details">

              ${nbQuestions} question(s)

              ${duree > 0
                ? ' • ' + duree + ' min'
                : ''
              }

              ${dejaFaite
                ? ' • ✓ Déjà terminée'
                : ''
              }

            </span>

          </span>

          <span class="epreuve-arrow">
            ${dejaFaite ? '✓' : '→'}
          </span>

        `;


        if(dejaFaite){

          btn.disabled = true;

          btn.style.opacity = '.65';

          btn.title =
            "Cette évaluation a déjà été réalisée.";

        }else{

          btn.addEventListener(
            'click',
            () => demarrerEpreuve(id,ep)
          );

        }


        container.appendChild(btn);

      });

    })

    .catch(e => {

      console.error(e);

      $('listeLead').textContent =
        "Erreur : " + e.message;

    });

  }


  /* ============================================
     DEMARRER EPREUVE
  ============================================ */

  function demarrerEpreuve(id,epreuve){

    if(evaluationDejaFaite(id)){

      alert(
        "Tu as déjà réalisé cette évaluation."
      );

      return;
    }


    epreuveActuelleId =
      id;

    epreuveActuelle =
      epreuve;

    questionIndex = 0;

    bonnesReponses = 0;

    historiqueReponses = [];

    reponseValidee = false;


    $('listeSection').hidden = true;

    $('resultSection').hidden = true;

    $('quizSection').hidden = false;


    $('quizTitre').textContent =
      epreuve.titre || 'Évaluation';


    demarrerChronometre();


    afficherQuestion();

  }


  /* ============================================
     CHRONOMETRE
  ============================================ */

  function demarrerChronometre(){

    arreterChronometre();


    const duree =
      Number(
        epreuveActuelle.duree || 0
      );


    if(duree <= 0){

      $('timer').textContent =
        'Sans limite';

      return;
    }


    tempsRestant =
      duree * 60;


    afficherTemps();


    timerInterval =
      setInterval(() => {

        tempsRestant--;

        afficherTemps();


        if(tempsRestant <= 0){

          arreterChronometre();

          alert(
            "Temps écoulé ! Ton évaluation va être terminée."
          );

          terminerEpreuve();

        }

      },1000);

  }


  function arreterChronometre(){

    if(timerInterval){

      clearInterval(timerInterval);

      timerInterval = null;

    }

  }


  function afficherTemps(){

    if(tempsRestant <= 0){

      $('timer').textContent =
        '00:00';

      return;

    }


    const minutes =
      Math.floor(
        tempsRestant / 60
      );

    const secondes =
      tempsRestant % 60;


    $('timer').textContent =
      String(minutes).padStart(2,'0') +
      ':' +
      String(secondes).padStart(2,'0');


    $('timer').classList.remove(
      'warning',
      'danger'
    );


    if(tempsRestant <= 30){

      $('timer').classList.add(
        'danger'
      );

    }else if(tempsRestant <= 120){

      $('timer').classList.add(
        'warning'
      );

    }

  }


  /* ============================================
     AFFICHER QUESTION
  ============================================ */

  function afficherQuestion(){

    reponseValidee = false;


    const questions =
      epreuveActuelle.questions || {};


    const ids =
      Object.keys(questions);


    if(ids.length === 0){

      alert(
        "Cette évaluation ne contient aucune question."
      );

      retourListe();

      return;
    }


    const q =
      questions[ids[questionIndex]];


    $('quizProgress').textContent =
      `Question ${questionIndex + 1} / ${ids.length}`;


    const container =
      $('quizContainer');


    container.innerHTML = '';


    const num =
      document.createElement('div');

    num.className =
      'question-num';

    num.textContent =
      `Question ${questionIndex + 1}`;

    container.appendChild(num);


    const texte =
      document.createElement('div');

    texte.className =
      'question-texte';

    texte.textContent =
      q.texte || '';

    container.appendChild(texte);


    /* IMAGE DE LA QUESTION */

    const image =
      obtenirImage(q);


    if(image){

      container.insertAdjacentHTML(
        'beforeend',
        afficherImage(
          image,
          'question-image'
        )
      );

    }


    /* CHOIX */

    const choix =
      Array.isArray(q.choix)
        ? q.choix
        : Object.values(q.choix || {});


    choix.forEach((c,i) => {

      const label =
        document.createElement('label');

      label.className =
        'choix-option';


      let texteChoix = '';

      let imageChoix = '';


      if(typeof c === 'object' && c !== null){

        texteChoix =
          c.texte ||
          c.text ||
          c.label ||
          '';

        imageChoix =
          obtenirImage(c);

      }else{

        texteChoix =
          String(c);

      }


      label.innerHTML = `

        <input
          type="radio"
          name="reponse"
          value="${i}"
        >

        <span>
          ${texteChoix}
        </span>

      `;


      if(imageChoix){

        label.insertAdjacentHTML(
          'beforeend',
          afficherImage(
            imageChoix,
            'choix-image'
          )
        );

      }


      label.addEventListener(
        'click',
        () => {

          if(!reponseValidee){

            $('validerBtn').disabled =
              false;

          }

        }
      );


    container.appendChild(label);

    });


    $('validerBtn').disabled = true;


    $('validerBtn').textContent =
      'Valider ma réponse';

  }


  /* ============================================
     VALIDATION
  ============================================ */

  function validerReponse(){

    if(reponseValidee){

      const total =
        Object.keys(
          epreuveActuelle.questions || {}
        ).length;


      questionIndex++;


      if(questionIndex < total){

        afficherQuestion();

      }else{

        terminerEpreuve();

      }


      return;

    }


    const ids =
      Object.keys(
        epreuveActuelle.questions || {}
      );


    const q =
      epreuveActuelle.questions[
        ids[questionIndex]
      ];


    const selection =
      document.querySelector(
        'input[name="reponse"]:checked'
      );


    if(!selection) return;


    const choisi =
      parseInt(
        selection.value,
        10
      );


    const bonne =
      Number(q.bonneReponse);


    document
      .querySelectorAll('.choix-option')
      .forEach((label,i) => {

        if(i === bonne){

          label.classList.add(
            'correct'
          );

        }

        if(i === choisi && i !== bonne){

          label.classList.add(
            'incorrect'
          );

        }

      });


    const correct =
      choisi === bonne;


    if(correct){

      bonnesReponses++;

    }


    historiqueReponses.push({

      question:
        q.texte || '',

      choix:
        choisi,

      bonneReponse:
        bonne,

      correct:
        correct

    });


    reponseValidee = true;


    const dernier =
      questionIndex === ids.length - 1;


    $('validerBtn').textContent =
      dernier
        ? 'Voir mon résultat'
        : 'Question suivante';

  }


  /* ============================================
     TERMINER EPREUVE
  ============================================ */

  function terminerEpreuve(){

    arreterChronometre();


    const total =
      Object.keys(
        epreuveActuelle.questions || {}
      ).length;


    if(total <= 0){

      retourListe();

      return;
    }


    const points =
      bonnesReponses * 5;


    const note =
      (bonnesReponses / total) * 20;


    if(profilActif){

      profilActif.points =
        Number(
          profilActif.points || 0
        ) + points;


      sauvegarderProfil(
        profilActif
      );


      if(typeof db !== 'undefined'){

        db.ref(
          'resultats/' +
          profilActif.id +
          '/' +
          epreuveActuelleId
        )

        .set({

          titre:
            epreuveActuelle.titre || '',

          classe:
            profilActif.classe || '',

          score:
            bonnesReponses,

          total:
            total,

          note:
            Number(note.toFixed(2)),

          points:
            points,

          date:
            new Date().toISOString(),

          terminee:
            true

        })

        .catch(e =>
          console.error(e)
        );

      }

    }


    marquerEvaluationFaite(
      epreuveActuelleId
    );


    $('quizSection').hidden =
      true;

    $('resultSection').hidden =
      false;


    $('resultScore').textContent =
      `${bonnesReponses}/${total}`;


    $('resultNote').textContent =
      `Note : ${note.toFixed(2)}/20`;


    $('resultPoints').textContent =
      `+${points} points ajoutés à ton carnet`;


    const pct =
      bonnesReponses / total;


    let msg;


    if(pct === 1){

      msg =
        "Parfait, sans aucune faute ! 🎉";

    }else if(pct >= .7){

      msg =
        "Très bon travail, continue comme ça !";

    }else if(pct >= .4){

      msg =
        "Pas mal. Revois les points ratés et continue tes efforts.";

    }else{

      msg =
        "Ne te décourage pas. Revois le cours et continue à t'entraîner.";

    }


    $('resultMsg').textContent =
      msg;


    afficherCorrection();

    chargerClassement();

  }


  /* ============================================
     CORRECTION
  ============================================ */

  function afficherCorrection(){

    const container =
      $('correctionContainer');


    container.innerHTML =
      '<h2>📋 Correction</h2>';


    historiqueReponses.forEach(
      (rep,index) => {

        const div =
          document.createElement('div');


        div.className =
          'correction-item ' +
          (
            rep.correct
              ? 'good'
              : 'bad'
          );


        div.innerHTML = `

          <div class="correction-question">

            ${index + 1}. ${rep.question}

          </div>

          <div class="correction-reponse">

            ${
              rep.correct
                ? '✅ Bonne réponse'
                : '❌ Réponse incorrecte'
            }

          </div>

        `;


        container.appendChild(div);

      }
    );

  }


  /* ============================================
     CLASSEMENT
  ============================================ */

  function chargerClassement(){

    const container =
      $('classementContainer');


    container.innerHTML =
      '<h2>🏆 Classement</h2><div class="loading">Chargement...</div>';


    if(typeof db === 'undefined'){

      container.innerHTML +=
        '<div class="message">Classement indisponible.</div>';

      return;
    }


    db.ref('eleves')
      .once('value')
      .then(snap => {

        const data =
          snap.val() || {};


        const eleves =
          Object.values(data)
          .filter(e => e && e.nom);


        eleves.sort(
          (a,b) =>
            Number(b.points || 0) -
            Number(a.points || 0)
        );


        const top =
          eleves.slice(0,10);


        container.innerHTML =
          '<h2>🏆 Classement</h2>';


        if(top.length === 0){

          container.innerHTML +=
            '<div class="message">Aucun élève classé pour le moment.</div>';

          return;
        }


        top.forEach((eleve,index) => {

          const row =
            document.createElement('div');

          row.className =
            'classement-row';


          const nom =
            (
              eleve.prenom
                ? eleve.prenom + ' '
                : ''
            ) +
            (
              eleve.nom || ''
            );


          row.innerHTML = `

            <span>
              ${index + 1}. ${nom}
            </span>

            <strong>
              ${Number(eleve.points || 0)} pts
            </strong>

          `;


          container.appendChild(row);

        });

      })

      .catch(e => {

        console.error(e);

        container.innerHTML =
          '<h2>🏆 Classement</h2>' +
          '<div class="message">Impossible de charger le classement.</div>';

      });

  }


  /* ============================================
     RETOUR
  ============================================ */

  function retourListe(){

    arreterChronometre();


    $('quizSection').hidden =
      true;

    $('resultSection').hidden =
      true;

    $('listeSection').hidden =
      false;


    chargerListeEpreuves();

  }


  $('validerBtn')
    .addEventListener(
      'click',
      validerReponse
    );


  $('retourBtn')
    .addEventListener(
      'click',
      retourListe
    );


  /* ============================================
     INITIALISATION
  ============================================ */

  profilActif =
    chargerProfilActif();


  chargerListeEpreuves();

})();

</script>
