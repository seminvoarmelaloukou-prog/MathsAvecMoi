<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Évaluations — Campus Flex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<style>
  :root{
    --ink:#1B2B22; --paper:#F5F1E4; --card:#FFFFFF;
    --forest:#2F6F4E; --forest-dark:#1F4E36;
    --amber:#E8A33D; --line:#DCD5C1; --muted:#6B7568;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Work Sans', sans-serif; padding-bottom:60px; }
  nav{
    background-color:#2c3e8c; padding:14px 20px; display:flex;
    justify-content:space-between; align-items:center; position:sticky; top:0; z-index:100;
  }
  nav h1{ color:#fff; font-family:'Fraunces', serif; font-weight:700; font-size:1.05rem; margin:0; }
  .nav-toggle{ display:none; }
  .nav-toggle-label{ display:none; color:#fff; font-size:26px; cursor:pointer; }
  nav ul{ list-style:none; display:flex; gap:18px; margin:0; padding:0; }
  nav ul li a{ color:#fff; text-decoration:none; font-size:.85rem; padding-bottom:4px; border-bottom:2px solid transparent; }
  nav ul li a.active{ border-color:#f39c12; }
  @media (max-width: 640px){
    .nav-toggle-label{ display:block; }
    nav ul{ position:absolute; top:100%; left:0; right:0; background:#1e2c66; flex-direction:column; gap:0; max-height:0; overflow:hidden; transition:max-height .3s ease; }
    nav ul li{ border-top:1px solid rgba(255,255,255,.1); }
    nav ul li a{ display:block; padding:14px 20px; }
    .nav-toggle:checked ~ ul{ max-height:300px; }
  }
  .wrap{ max-width:520px; margin:0 auto; padding:0 18px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px; margin-top:20px; }
  .card h1{ font-family:'Fraunces', serif; font-size:1.3rem; margin:0 0 6px; }
  .card p.lead{ color:var(--muted); font-size:.9rem; margin:0 0 16px; }

  .epreuve-btn{
    width:100%; display:flex; justify-content:space-between; align-items:center;
    background:#FCFAF4; border:1.5px solid var(--line); border-radius:10px;
    padding:14px 16px; margin-bottom:10px; cursor:pointer; font-family:'Work Sans', sans-serif; font-size:.95rem;
  }
  .epreuve-btn:active{ background:#EFEAD8; }
  .epreuve-arrow{ color:var(--forest-dark); font-weight:600; }

  .question-card{ margin-top:18px; }
  .question-num{ font-size:.75rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px; }
  .question-texte{ font-weight:600; margin-bottom:12px; font-size:1.02rem; }
  .choix-option{
    display:block; background:#FCFAF4; border:1.5px solid var(--line); border-radius:9px;
    padding:12px 14px; margin-bottom:8px; cursor:pointer; font-size:.92rem;
  }
  .choix-option input{ margin-right:10px; accent-color:var(--forest); }
  .choix-option.correct{ border-color:var(--forest); background:#EAF2ED; }
  .choix-option.incorrect{ border-color:#B3401F; background:#FBEAE6; }

  button.primary{
    width:100%; margin-top:20px; padding:14px; border:none; border-radius:9px;
    background:var(--forest); color:#fff; font-weight:600; font-size:1rem; cursor:pointer;
  }
  button.primary:disabled{ opacity:.5; }

  .result-card{ text-align:center; padding:30px 20px; }
  .result-score{ font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:2.8rem; color:var(--forest-dark); }
  .result-total{ color:var(--muted); font-size:.95rem; margin-top:4px; }
  .result-msg{ margin-top:14px; font-size:.95rem; }

  [hidden]{ display:none !important; }
</style>
</head>
<body>

<nav>
  <h1>📐 MathsAvecMoi</h1>
  <input type="checkbox" id="nav-toggle" class="nav-toggle">
  <label for="nav-toggle" class="nav-toggle-label">☰</label>
  <ul>
    <li><a href="index.html">Accueil</a></li>
    <li><a href="epreuves.html">Épreuves</a></li>
    <li><a href="evaluation.html" class="active">Évaluations</a></li>
    <li><a href="videos.html">Vidéos</a></li>
    <li><a href="profil.html">Mon profil</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<div class="wrap">

  <section id="listeSection" class="card">
    <h1>Évaluations disponibles</h1>
    <p class="lead" id="listeLead">Chargement...</p>
    <div id="listeContainer"></div>
  </section>

  <section id="quizSection" class="card" hidden>
    <h1 id="quizTitre">—</h1>
    <p class="lead" id="quizProgress">Question 1</p>
    <div id="quizContainer"></div>
    <button class="primary" id="validerBtn" disabled>Valider ma réponse</button>
  </section>

  <section id="resultSection" class="card result-card" hidden>
    <div class="result-score" id="resultScore">0/0</div>
    <div class="result-total" id="resultPoints">+0 points</div>
    <div class="result-msg" id="resultMsg"></div>
    <button class="primary" id="retourBtn">Retour aux évaluations</button>
  </section>

</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const STORAGE_PROFILES = 'cf_profiles';
  const STORAGE_ACTIVE = 'cf_active';

  let profilActif = null;
  let epreuveActuelle = null;
  let epreuveActuelleId = null;
  let questionIndex = 0;
  let bonnesReponses = 0;
  let reponseValidee = false;

  function chargerProfilActif(){
    const id = localStorage.getItem(STORAGE_ACTIVE);
    if (!id) return null;
    const raw = localStorage.getItem(STORAGE_PROFILES);
    const all = raw ? JSON.parse(raw) : {};
    return all[id] || null;
  }

  function sauvegarderProfil(p){
    const raw = localStorage.getItem(STORAGE_PROFILES);
    const all = raw ? JSON.parse(raw) : {};
    all[p.id] = p;
    localStorage.setItem(STORAGE_PROFILES, JSON.stringify(all));
    if (typeof db !== 'undefined'){
      db.ref('eleves/' + p.id).set(p).catch(()=>{});
    }
  }

  function chargerListeEpreuves(){
    if (!profilActif){
      $('listeLead').textContent = "Crée d'abord ton carnet dans Mon profil pour accéder aux évaluations.";
      return;
    }
    db.ref('epreuves/' + profilActif.classe).once('value').then(snap => {
      const data = snap.val() || {};
      const ids = Object.keys(data);
      if (ids.length === 0){
        $('listeLead').textContent = "Aucune évaluation disponible pour ta classe pour l'instant.";
        return;
      }
      $('listeLead').textContent = `Évaluations pour la classe ${profilActif.classe} :`;
      const container = $('listeContainer');
      container.innerHTML = '';
      ids.forEach(id => {
        const ep = data[id];
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'epreuve-btn';
        btn.innerHTML = `<span>${ep.titre}</span><span class="epreuve-arrow">→</span>`;
        btn.addEventListener('click', () => demarrerEpreuve(id, ep));
        container.appendChild(btn);
      });
    });
  }

  function demarrerEpreuve(id, epreuve){
    epreuveActuelleId = id;
    epreuveActuelle = epreuve;
    questionIndex = 0;
    bonnesReponses = 0;
    $('listeSection').hidden = true;
    $('quizSection').hidden = false;
    $('quizTitre').textContent = epreuve.titre;
    afficherQuestion();
  }

  function afficherQuestion(){
    reponseValidee = false;
    const questions = epreuveActuelle.questions;
    const q = questions[questionIndex];
    $('quizProgress').textContent = `Question ${questionIndex + 1} / ${questions.length}`;

    const container = $('quizContainer');
    container.innerHTML = `<div class="question-texte">${q.texte}</div>`;

    q.choix.forEach((c, i) => {
      const label = document.createElement('label');
      label.className = 'choix-option';
      label.innerHTML = `<input type="radio" name="reponse" value="${i}"> ${c}`;
      label.addEventListener('click', () => {
        $('validerBtn').disabled = false;
      });
      container.appendChild(label);
    });

    $('validerBtn').disabled = true;
    $('validerBtn').textContent = 'Valider ma réponse';
  }

  function validerReponse(){
    if (reponseValidee){
      // passer à la question suivante ou finir
      questionIndex++;
      if (questionIndex < epreuveActuelle.questions.length){
        afficherQuestion();
      } else {
        terminerEpreuve();
      }
      return;
    }

    const q = epreuveActuelle.questions[questionIndex];
    const selection = document.querySelector('input[name="reponse"]:checked');
    if (!selection) return;
    const choisi = parseInt(selection.value, 10);

    document.querySelectorAll('.choix-option').forEach((label, i) => {
      if (i === q.bonneReponse) label.classList.add('correct');
      else if (i === choisi) label.classList.add('incorrect');
    });

    if (choisi === q.bonneReponse) bonnesReponses++;

    reponseValidee = true;
    const dernierIndex = questionIndex === epreuveActuelle.questions.length - 1;
    $('validerBtn').textContent = dernierIndex ? 'Voir mon résultat' : 'Question suivante';
  }
