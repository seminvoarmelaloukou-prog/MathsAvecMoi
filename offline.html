<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pas de connexion - Campus Flex</title>
<meta name="theme-color" content="#2c3e8c">
<style>
  :root{--bg:#FFFFFF;--text:#14203F;--muted:#46547A;--ink:#2c3e8c;--btn-fg:#FFFFFF}
  @media (prefers-color-scheme:dark){:root{--bg:#0E1630;--text:#E8EDFB;--muted:#A3B0D2;--ink:#A9BEFF;--btn-fg:#0E1630}}
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 22px;background:var(--bg);color:var(--text);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:460px;margin:0 auto}
  h1{font-size:1.9rem;line-height:1.15;letter-spacing:-.02em;color:var(--ink);margin-bottom:12px}
  p{color:var(--muted);margin-bottom:22px}
  button,a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 24px;border-radius:10px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
  button{background:var(--ink);color:var(--btn-fg);border:2px solid var(--ink);margin-right:10px}
  a{color:var(--ink);border:2px solid var(--ink)}
  :focus-visible{outline:3px solid #f39c12;outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>Tu n’as pas de connexion pour le moment.</h1>
  <p>Tes cours et tes exercices ont besoin d’internet. Vérifie ton réseau ou tes données mobiles, puis réessaie.</p>
  <button type="button" onclick="location.reload()">Réessayer</button>
  <a href="index.html">Accueil</a>
</main>
</body>
</html>
