<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Test Gemini API</title>
</head>
<body>
  <h1>Test API Gemini</h1>
  <input type="text" id="question" placeholder="Pose une question" style="width: 400px; padding: 10px;">
  <button onclick="testerAPI()" style="padding: 10px 20px;">Tester</button>
  <div id="reponse" style="margin-top: 20px; padding: 15px; background: #f0f0f0;"></div>

  <script>
    const GEMINI_API_KEY = "AQ.Ab8RN6ImtMvSH0KTH9Z5frv8uYTOzhXLSkXvHvmyygbfGoABlA";

    async function testerAPI() {
      const question = document.getElementById("question").value;
      const reponseDiv = document.getElementById("reponse");
      
      reponseDiv.textContent = "Envoi en cours...";

      try {
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${GEMINI_API_KEY}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{
                parts: [{ text: "Réponds à cette question de maths : " + question }]
              }]
            })
          }
        );

        const data = await response.json();
        console.log("Réponse API :", data);

        if (data.error) {
          reponseDiv.textContent = "ERREUR : " + data.error.message;
        } else if (data.candidates && data.candidates[0]) {
          reponseDiv.textContent = "RÉPONSE : " + data.candidates[0].content.parts[0].text;
        } else {
          reponseDiv.textContent = "Pas de réponse. Vérifie la console (F12).";
        }
      } catch (erreur) {
        console.error("Erreur :", erreur);
        reponseDiv.textContent = "ERREUR : " + erreur.message;
      }
    }
  </script>
</body>
</html>
