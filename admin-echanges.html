<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Échanges - Campus Flex</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="suivi-visite.js"></script>
<style>
:root{--indigo:#2c3e8c;--amber:#f39c12;--bg:#f5f7ff;--muted:#666}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Arial,sans-serif;background:var(--bg);color:#333}
nav{background:var(--indigo);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:10}
nav h1{color:#fff;font-size:20px}
nav .liens{display:flex;gap:16px;flex-wrap:wrap}
nav a{color:#fff;text-decoration:none;font-size:14px}
main{max-width:900px;margin:24px auto;padding:0 14px}
.card{background:#fff;padding:20px 16px;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.1);margin-bottom:20px}
.card h2{color:var(--indigo);font-size:19px;margin-bottom:10px}
p{color:var(--muted);line-height:1.5;font-size:15px}
.erreur{color:#c0392b}
.cache{display:none}
.loader{width:30px;height:30px;border:3px solid #e3e7f6;border-top-color:var(--amber);border-radius:50%;animation:t .8s linear infinite}
@keyframes t{to{transform:rotate(360deg)}}
.ligne{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
select,input[type=text],textarea{font:inherit;font-size:15px;padding:10px;border:1px solid #cfd6f0;border-radius:10px;background:#fff;color:#333}
select,input[type=text]{flex:1;min-width:140px}
textarea{width:100%;min-height:70px;resize:vertical}
button{font:inherit;font-size:15px;font-weight:bold;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:var(--indigo);color:#fff}
button.sec{background:#e3e7f6;color:var(--indigo)}
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button{flex:1;background:#e3e7f6;color:var(--indigo)}
.tabs button.on{background:var(--indigo);color:#fff}
.fil{background:#f5f7ff;border-radius:12px;padding:10px;max-height:460px;overflow-y:auto;margin:10px 0}
.msg{max-width:85%;margin:8px 0;padding:8px 12px;border-radius:12px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.msg.moi{margin-left:auto;background:#dfe6ff}
.msg .qui{font-size:12px;font-weight:bold;color:var(--indigo)}
.msg .badge{font-size:11px;background:var(--amber);color:#fff;border-radius:8px;padding:1px 6px;margin-left:4px}
.msg .texte{white-space:pre-wrap;word-wrap:break-word;font-size:15px;margin-top:2px}
.msg .date{font-size:11px;color:#888;margin-top:2px}
.msg .sup{float:right;background:none;color:#c0392b;padding:0 4px;font-size:14px}
.fil-vide{color:#888;font-size:14px;text-align:center;padding:14px}
.thread{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;border:1px solid #e3e7f6;border-radius:10px;margin-bottom:8px;cursor:pointer;background:#fff}
.thread.attente{border-color:var(--amber);background:#fff8ea}
.thread small{color:var(--muted);display:block}
.tag{background:#e3e7f6;color:var(--indigo);border-radius:8px;font-size:12px;font-weight:bold;padding:2px 8px;margin-right:4px}
.pastille{background:var(--amber);color:#fff;border-radius:10px;font-size:12px;font-weight:bold;padding:2px 8px}
.thread.nouveau b{color:#000}
.notifs{margin:12px 0;padding:10px;border:2px solid var(--amber);border-radius:12px;background:#fff8ea}
.notifs-t{font-weight:bold;color:var(--indigo);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.notifs .fermer{padding:2px 10px;font-size:12px}
.notifs .notif{display:block;width:100%;text-align:left;margin:4px 0;font-size:14px;font-weight:normal;background:#fff;color:#333;border:1px solid #e3e7f6}

.reacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.msg .reacts button,.msg .picker button{padding:2px 9px;font-size:13px;font-weight:bold;border-radius:14px;background:#e3e7f6;color:var(--indigo)}
.msg .reacts button.on,.msg .picker button.on{background:var(--amber);color:#fff}
.picker{display:none;gap:4px;flex-wrap:wrap;width:100%;margin-top:6px;padding:6px;border-radius:12px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.15)}
.picker.ouvert{display:flex}
.msg .picker button{font-size:18px;padding:4px 8px}
.note{font-size:13px;color:#888;margin-top:6px}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap">
<link rel="stylesheet" href="campus-menu.css">
<link rel="stylesheet" href="campus-admin.css">
<script src="campus-menu.js" defer></script>
<script src="programme.js"></script>
</head>
<body>
<header class="barre">
  <div class="barre-haut">
    <a class="marque" href="index.html"><img data-garder src="logo-icone.png" alt="">Campus Flex</a>
    <button class="burger" id="burger" type="button" aria-expanded="false" aria-controls="menu-principal" aria-label="Ouvrir le menu"><span></span><span></span><span></span></button>
  </div>
  <div class="menu-panneau" id="menu-principal" role="navigation" aria-label="Navigation principale">
    <div class="interieur"><div class="liens">
        <a href="admin.html">Tableau de bord</a>
        <a href="#" class="sortie" data-deconnexion id="deconnexion" data-propre>Déconnexion</a>
    </div></div>
  </div>
</header>
<main>

    <p class="salut ecrit">Échanges</p>

  <section class="card" id="verif"><div class="loader"></div><p id="verif-msg" style="margin-top:10px">Vérification...</p></section>
  <div id="contenu" class="cache">
    <section class="card">
      <h2>Surveillance des échanges</h2>
      <p>Tu vois toutes les discussions de classe et tous les messages privés entre élèves et enseignants. Tu peux répondre en tant qu'« Administration » et supprimer un message inapproprié.</p>
      <div id="notifs" class="notifs cache"></div>
      <div class="tabs">
        <button id="tab-prive" class="on">Messages privés <span id="pastille" class="pastille cache">0</span></button>
        <button id="tab-forum">Discussions de classe</button>
      </div>

      <div id="vue-prive">
        <div class="ligne">
          <select id="f-classe"></select>
          <select id="f-statut"><option value="">Toutes les conversations</option><option value="attente">Sans réponse d'un enseignant</option></select>
        </div>
        <div id="mp-liste"></div>
        <div id="mp-zone" class="cache">
          <button class="sec" id="mp-retour">← Retour aux conversations</button>
          <h3 id="mp-titre" style="margin-top:10px;color:var(--indigo);font-size:17px"></h3>
          <div class="fil" id="mp-fil"></div>
          <form id="mp-form"><textarea id="mp-texte" maxlength="1000" placeholder="Répondre en tant qu'Administration..."></textarea>
            <div class="ligne"><button type="submit">Envoyer</button></div></form>
        </div>
      </div>

      <div id="vue-forum" class="cache">
        <div class="ligne"><select id="fo-classe"></select><select id="fo-matiere"></select></div>
        <div class="fil" id="forum-fil"></div>
        <form id="forum-form"><textarea id="forum-texte" maxlength="1000" placeholder="Publier un message dans cette discussion (Administration)..."></textarea>
          <div class="ligne"><button type="submit">Publier</button></div></form>
      </div>
      <p id="msg" class="erreur"></p>
    </section>
  </div>
</main>
<script>
const CLASSES=["6e","5e","4e","3e","2de AB","2de C","2de D","2de E","1re AB","1re C","1re D","1re E","Tle AB","Tle C","Tle D","Tle E"];
const MATIERES=["Mathématiques","Français","Anglais","PCT","SVT","Histoire-Géographie","Éducation civique","EPS","Espagnol","Allemand","Philosophie"];
const NOM="Administration";
const $=id=>document.getElementById(id);
const fmt=t=>t?new Date(t).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):"";
let U=null,THREADS=[],cur=null,refIdx=null,refMp=null,refFo=null;
const INC=n=>firebase.database.ServerValue.increment(n);
const REACTIONS=[{k:"jaime",e:"👍",l:"J'aime"},{k:"coeur",e:"❤️",l:"J'adore"},{k:"etonne",e:"😮",l:"Étonnant"},{k:"merci",e:"🙏",l:"Merci"},{k:"rire",e:"😂",l:"Drôle"}];
// « Nouveau » : un message est nouveau tant que tu n'as pas ouvert la conversation (mémorisé sur cet appareil)
const vuCle=t=>"cf_adm_vu_"+U.uid+"_"+t.classe+"_"+t.matiere+"_"+t.uid;
function base(){try{let b=parseInt(localStorage.getItem("cf_adm_base_"+U.uid));if(!b){b=Date.now();localStorage.setItem("cf_adm_base_"+U.uid,String(b));}return b;}catch(e){return 0;}}
function dernierVu(t){try{return Math.max(base(),parseInt(localStorage.getItem(vuCle(t)))||0);}catch(e){return 0;}}
function marquerVu(t,d){try{localStorage.setItem(vuCle(t),String(Math.max(d||0,Date.now())));}catch(e){}}
const estNouveau=t=>(t.v.date||0)>dernierVu(t);
$("deconnexion").addEventListener("click",e=>{e.preventDefault();auth.signOut().then(()=>{location.href="index.html";});});
auth.onAuthStateChanged(function(u){
  if(!u){location.href="connexion.html";return;}
  U=u;
  db.ref("administrateurs/"+u.uid).once("value").then(function(s){
    if(!s.exists()){$("verif-msg").textContent="Cette page est réservée aux administrateurs.";$("verif-msg").className="erreur";return;}
    $("verif").classList.add("cache");$("contenu").classList.remove("cache");init();
  }).catch(e=>{$("verif-msg").textContent="Erreur : "+e.message;$("verif-msg").className="erreur";});
});
function init(){
  $("f-classe").innerHTML='<option value="">Toutes les classes</option>'+CLASSES.map(c=>'<option>'+c+'</option>').join("");
  $("fo-classe").innerHTML=CLASSES.map(c=>'<option>'+c+'</option>').join("");
  $("fo-matiere").innerHTML=MATIERES.map(c=>'<option>'+c+'</option>').join("");
  $("f-classe").addEventListener("change",listeThreads);$("f-statut").addEventListener("change",listeThreads);
  $("tab-prive").addEventListener("click",()=>onglet("prive"));$("tab-forum").addEventListener("click",()=>onglet("forum"));
  $("mp-retour").addEventListener("click",fermer);$("mp-form").addEventListener("submit",envoyerMp);
  $("fo-classe").addEventListener("change",ouvrirForum);$("fo-matiere").addEventListener("change",ouvrirForum);$("forum-form").addEventListener("submit",envoyerForum);
  document.addEventListener("visibilitychange",marquerNotifsLues);ecouterNotifs();
  refIdx=db.ref("mp_index");
  refIdx.on("value",function(snap){
    THREADS=[];
    snap.forEach(function(c){c.forEach(function(m){m.forEach(function(e){THREADS.push({classe:c.key,matiere:m.key,uid:e.key,v:e.val()||{}});});});});
    THREADS.sort((a,b)=>(b.v.date||0)-(a.v.date||0));listeThreads();
  },function(er){$("msg").textContent="Lecture impossible : "+er.message+" (publie les nouvelles règles Firebase).";});
}
function onglet(n){
  $("tab-prive").classList.toggle("on",n==="prive");$("tab-forum").classList.toggle("on",n==="forum");
  $("vue-prive").classList.toggle("cache",n!=="prive");$("vue-forum").classList.toggle("cache",n!=="forum");
  if(n==="forum")ouvrirForum();
}
function listeThreads(){
  const fc=$("f-classe").value,fs=$("f-statut").value;
  const l=THREADS.filter(t=>(!fc||t.classe===fc)&&(!fs||t.v.dernierAuteur==="eleve"));
  if(cur){const c2=THREADS.find(t=>t.classe===cur.classe&&t.matiere===cur.matiere&&t.uid===cur.uid);if(c2&&estNouveau(c2))marquerVu(c2,c2.v.date);}
  const att=THREADS.filter(estNouveau).length;
  $("pastille").textContent=att>99?"99+":att;$("pastille").classList.toggle("cache",!att);
  $("mp-liste").innerHTML=l.length?"":'<p>Aucune conversation.</p>';
  l.forEach(function(t){
    const d=document.createElement("div");d.className="thread"+(estNouveau(t)?" nouveau attente":"");
    const g=document.createElement("div");
    const n=document.createElement("b");n.textContent=t.v.nomEleve||"Élève";
    const tg=document.createElement("div");tg.style.margin="3px 0";
    [t.classe,t.matiere].forEach(x=>{const s=document.createElement("span");s.className="tag";s.textContent=x;tg.appendChild(s);});
    const sm=document.createElement("small");sm.textContent=(t.v.dernierAuteur==="eleve"?"L'élève : ":"Enseignant : ")+(t.v.dernierTexte||"")+" · "+fmt(t.v.date);
    g.appendChild(n);g.appendChild(tg);g.appendChild(sm);d.appendChild(g);
    const dr=document.createElement("div");dr.style.cssText="display:flex;flex-direction:column;gap:4px;align-items:flex-end";
    if(estNouveau(t)){const b=document.createElement("span");b.className="pastille";b.textContent="Nouveau";dr.appendChild(b);}
    if(estNouveau(t)&&t.v.dernierAuteur==="eleve"){const b=document.createElement("span");b.className="tag";b.style.margin="0";b.textContent="Sans réponse";dr.appendChild(b);}
    if(dr.children.length)d.appendChild(dr);
    d.addEventListener("click",()=>ouvrir(t));$("mp-liste").appendChild(d);
  });
}
/* ---------- notifications de réactions ---------- */
let NEW=[],VUS={},PEND=[];
function ctxDe(chemin,id){
  const p=chemin.split("/");
  return p[0]==="forum"?{type:"forum",c:p[1],m:p[2],id:id}:{type:"prive",c:p[1],m:p[2],eleve:p[3],id:id};
}
function ecouterNotifs(){
  db.ref("notifications/"+U.uid).orderByChild("date").limitToLast(50).on("value",function(s){
    const ajout=[];PEND=[];
    s.forEach(function(ch){
      const v=ch.val()||{};
      if(v.lu===false){PEND.push(ch.key);const k=ch.key+"_"+(v.date||0);if(!VUS[k]){VUS[k]=1;ajout.push({id:ch.key,v:v});}}
    });
    if(ajout.length){NEW=ajout.concat(NEW).sort((a,b)=>(b.v.date||0)-(a.v.date||0)).slice(0,20);rendreNotifs();}
    marquerNotifsLues();
  },function(){});
}
// Marquées comme lues dès que la page est affichée : rien à faire
function marquerNotifsLues(){
  if(!U||!PEND.length||document.visibilityState!=="visible")return;
  const u={};PEND.forEach(function(id){u[id+"/lu"]=true;});PEND=[];
  db.ref("notifications/"+U.uid).update(u).catch(function(){});
}
function rendreNotifs(){
  const z=$("notifs");z.innerHTML="";
  if(!NEW.length){z.classList.add("cache");return;}
  z.classList.remove("cache");
  const h=document.createElement("div");h.className="notifs-t";
  const t=document.createElement("span");t.textContent="Nouvelles réactions";
  const x=document.createElement("button");x.type="button";x.className="fermer";x.textContent="Fermer";
  x.addEventListener("click",function(){NEW=[];rendreNotifs();});
  h.appendChild(t);h.appendChild(x);z.appendChild(h);
  NEW.forEach(function(n){
    const v=n.v,r=REACTIONS.filter(q=>q.k===v.reaction)[0]||{e:"👍"};
    const a=document.createElement("button");a.type="button";a.className="notif";
    a.textContent=r.e+" "+(v.de||"Quelqu'un")+" a réagi à ton message « "+(v.extrait||"")+" »";
    a.addEventListener("click",function(){allerA(v);});
    z.appendChild(a);
  });
}
function allerA(v){
  if(v.type==="prive"){
    onglet("prive");
    const t=THREADS.filter(q=>q.classe===v.classe&&q.matiere===v.matiere&&q.uid===v.eleve)[0];
    if(t)ouvrir(t);
  }else{
    onglet("forum");$("fo-classe").value=v.classe;$("fo-matiere").value=v.matiere;ouvrirForum();
  }
}
function reactions(d,m,ref,ctx){
  const R=m.reactions||{},mine=R[U.uid]||null,cnt={};
  Object.keys(R).forEach(u=>{cnt[R[u]]=(cnt[R[u]]||0)+1;});
  const bar=document.createElement("div");bar.className="reacts";
  const pk=document.createElement("div");pk.className="picker";
  function choisir(k){
    const r=ref.child("reactions/"+U.uid);
    const nref=(m.auteurUid&&m.auteurUid!==U.uid)?db.ref("notifications/"+m.auteurUid+"/"+ctx.id+"_"+U.uid):null;
    (mine===k
      ?r.remove().then(function(){if(nref)nref.remove().catch(function(){});})
      :r.set(k).then(function(){if(nref)nref.set({deUid:U.uid,de:NOM,reaction:k,extrait:String(m.texte||"").slice(0,80),type:ctx.type,classe:ctx.c,matiere:ctx.m,eleve:ctx.eleve||"",msgId:ctx.id,date:Date.now(),lu:false}).catch(function(){});})
    ).catch(function(e){$("msg").textContent="Réaction impossible : "+e.message;});
  }
  REACTIONS.forEach(function(r){
    if(cnt[r.k]){
      const b=document.createElement("button");b.type="button";b.className=mine===r.k?"on":"";
      b.textContent=r.e+" "+cnt[r.k];b.title=r.l;b.addEventListener("click",()=>choisir(r.k));bar.appendChild(b);
    }
    const p=document.createElement("button");p.type="button";p.className=mine===r.k?"on":"";
    p.textContent=r.e;p.title=r.l;p.setAttribute("aria-label",r.l);p.addEventListener("click",()=>choisir(r.k));pk.appendChild(p);
  });
  const plus=document.createElement("button");plus.type="button";plus.className="sec";plus.textContent="☺ Réagir";
  plus.addEventListener("click",()=>pk.classList.toggle("ouvert"));
  bar.appendChild(plus);d.appendChild(bar);d.appendChild(pk);
}
function rendre(zone,snap,suppr,chemin){
  const items=[];snap.forEach(ch=>{items.push({id:ch.key,v:ch.val()});});
  items.sort((a,b)=>(a.v.date||0)-(b.v.date||0));
  const proche=!zone.dataset.init||(zone.scrollHeight-zone.scrollTop-zone.clientHeight<80),prev=zone.scrollTop;zone.innerHTML="";
  if(!items.length){zone.innerHTML='<div class="fil-vide">Aucun message.</div>';return;}
  items.forEach(function(it){
    const m=it.v,d=document.createElement("div");d.className="msg"+(m.auteurUid===U.uid?" moi":"");
    const q=document.createElement("div");q.className="qui";q.textContent=m.auteurNom||"";
    if(m.role==="enseignant"){const b=document.createElement("span");b.className="badge";b.textContent="Enseignant";q.appendChild(b);}
    const sup=document.createElement("button");sup.className="sup";sup.textContent="✕";sup.title="Supprimer";
    sup.addEventListener("click",function(){if(confirm("Supprimer ce message ?"))suppr(it.id).catch(e=>{$("msg").textContent="Suppression impossible : "+e.message;});});
    q.appendChild(sup);
    const t=document.createElement("div");t.className="texte";t.textContent=m.texte||"";
    const dt=document.createElement("div");dt.className="date";dt.textContent=fmt(m.date);
    d.appendChild(q);d.appendChild(t);d.appendChild(dt);reactions(d,m,db.ref(chemin+"/"+it.id),ctxDe(chemin,it.id));zone.appendChild(d);
  });
  zone.scrollTop=proche?zone.scrollHeight:prev;zone.dataset.init="1";
}
function ouvrir(t){
  cur=t;marquerVu(t,t.v.date);$("mp-fil").dataset.init="";listeThreads();$("mp-liste").classList.add("cache");$("f-classe").parentNode.classList.add("cache");$("mp-zone").classList.remove("cache");
  $("mp-titre").textContent=(t.v.nomEleve||"Élève")+" — "+t.classe+" · "+t.matiere;
  if(refMp)refMp.off();
  refMp=db.ref("messages_prives/"+t.classe+"/"+t.matiere+"/"+t.uid).orderByChild("date").limitToLast(200);
  refMp.on("value",s=>rendre($("mp-fil"),s,id=>db.ref("messages_prives/"+t.classe+"/"+t.matiere+"/"+t.uid+"/"+id).remove(),"messages_prives/"+t.classe+"/"+t.matiere+"/"+t.uid),e=>{$("msg").textContent="Lecture impossible : "+e.message;});
}
function fermer(){if(refMp){refMp.off();refMp=null;}cur=null;$("mp-zone").classList.add("cache");$("mp-liste").classList.remove("cache");$("f-classe").parentNode.classList.remove("cache");}
function envoyerMp(e){
  e.preventDefault();const t=$("mp-texte").value.trim();if(!t||!cur)return;const now=Date.now(),c=cur;
  db.ref("messages_prives/"+c.classe+"/"+c.matiere+"/"+c.uid).push({auteurUid:U.uid,auteurNom:NOM,role:"enseignant",texte:t,date:now}).then(function(){
    $("mp-texte").value="";marquerVu(c,now);
    return db.ref("mp_index/"+c.classe+"/"+c.matiere+"/"+c.uid).update({dernierAuteur:"enseignant",dernierTexte:t.slice(0,160),date:now,luEns:true,nonLusEns:0,luEleve:false,nonLusEleve:INC(1)});
  }).catch(er=>{$("msg").textContent="Envoi impossible : "+er.message;});
}
function ouvrirForum(){
  if(refFo){refFo.off();refFo=null;}$("forum-fil").dataset.init="";const c=$("fo-classe").value,m=$("fo-matiere").value;if(!c||!m)return;
  refFo=db.ref("forum/"+c+"/"+m).orderByChild("date").limitToLast(200);
  refFo.on("value",s=>rendre($("forum-fil"),s,id=>db.ref("forum/"+c+"/"+m+"/"+id).remove(),"forum/"+c+"/"+m),e=>{$("msg").textContent="Lecture impossible : "+e.message;});
}
function envoyerForum(e){
  e.preventDefault();const t=$("forum-texte").value.trim(),c=$("fo-classe").value,m=$("fo-matiere").value;if(!t)return;
  db.ref("forum/"+c+"/"+m).push({auteurUid:U.uid,auteurNom:NOM,role:"enseignant",texte:t,date:Date.now()}).then(()=>{$("forum-texte").value="";}).catch(er=>{$("msg").textContent="Envoi impossible : "+er.message;});
}
</script>
