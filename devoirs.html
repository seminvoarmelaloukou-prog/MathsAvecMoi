<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devoirs - Campus Flex</title>
<meta name="theme-color" content="#2c3e8c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="pwa-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<link rel="stylesheet" href="campus.css">
<link rel="stylesheet" href="campus-menu.css">
<script src="campus-menu.js" defer></script>
<script src="programme.js"></script>
<style>
[hidden]{display:none !important}
.onglets{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.onglets button{min-height:44px;padding:8px 16px;border-radius:999px;background:transparent;color:var(--ink);border-color:var(--ink);font-size:.95rem}
.onglets button[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-fg)}

.devoir-card{background:var(--card);border:2px solid var(--line);border-left:5px solid var(--ink);border-radius:6px;padding:18px 16px;margin-bottom:16px;animation:pop .35s ease both}
.devoir-card h3{font-size:1.1rem;color:var(--ink);margin-bottom:4px;overflow-wrap:anywhere}
.devoir-card .meta{color:var(--muted);font-size:.9rem;margin-bottom:12px}
.partie-badge{display:inline-block;margin-bottom:8px;padding:2px 10px;border-radius:999px;background:var(--hl);color:var(--ink);font-size:.78rem;font-weight:800}
.liens{display:flex;flex-direction:column;gap:10px}
.liens .btn,.liens span.btn{width:100%}
.btn.corrige{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.verrouille{background:var(--hl);color:var(--ink);border-color:var(--amber);cursor:default}
.chrono-devoir{font-size:1.2rem;font-weight:800;color:var(--ink);text-align:center;padding:6px 0}
.texte-devoir,.contenu-corrige{margin-top:14px;padding:14px;background:#fff;color:#14203F;border-radius:6px;line-height:1.8;overflow-x:auto}
.texte-devoir img,.contenu-corrige img{max-width:100%;height:auto}
details.texte-corrige{margin-top:12px}
details.texte-corrige>summary{list-style:none;cursor:pointer}
details.texte-corrige>summary::-webkit-details-marker{display:none}
</style>
</head>

<body>

<header class="barre">
  <div class="barre-haut">
    <a class="marque" href="index.html"><img data-garder src="logo-icone.png" alt="">Campus Flex</a>
    <button class="burger" id="burger" type="button" aria-expanded="false" aria-controls="menu-principal" aria-label="Ouvrir le menu"><span></span><span></span><span></span></button>
  </div>
  <div class="menu-panneau" id="menu-principal" role="navigation" aria-label="Navigation principale">
    <div class="interieur"><div class="liens">
        <a href="profil.html">Mon profil</a>
        <a href="matieres.html">Matières</a>
        <a href="composition.html">Composer</a>
        <a href="echanges.html">Échanges</a>
        <a href="emploi-eleve.html">Emploi du temps</a>
        <a href="bulletin.html">Mon bulletin</a>
        <a href="mes-resultats.html">Mes résultats</a>
        <a href="index.html">Accueil</a>
        <a href="#" class="sortie" data-deconnexion>Se déconnecter</a>
    </div></div>
  </div>
</header>

<main>

  <p class="salut ecrit">Devoirs</p>

  <section class="carte">
    <h2 id="titreMatiere">Devoirs</h2>
    <p class="aide" id="infoStatut">Chargement...</p>
    <div class="onglets" id="parties" role="group" aria-label="Type de français" hidden></div>
  </section>

  <div id="listeDevoirs"></div>

</main>

<footer>© 2026 Campus Flex - Tous droits réservés - <a href="contact.html">Contact</a></footer>

<script>
    const titreMatiere = document.getElementById("titreMatiere");
    const infoStatut = document.getElementById("infoStatut");
    const listeDevoirs = document.getElementById("listeDevoirs");
    const zoneParties = document.getElementById("parties");

    let tousLesDevoirs = {};
    let classeEleve = "";
    let matiereCourante = "";
    let partieChoisie = "tous";

    function getMatiereFromURL() {
      const params = new URLSearchParams(window.location.search);
      return params.get("matiere");
    }

    function formaterDate(timestamp) {
      const d = new Date(timestamp);
      return d.toLocaleDateString("fr-FR");
    }

    // Texte sûr à insérer dans le HTML (titres, liens). Les énoncés et corrigés en HTML restent tels quels.
    function esc(t) {
      return String(t == null ? "" : t).replace(/[&<>"']/g, function(c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    window.addEventListener("load", function() {
      if (!firebase.auth || !firebase.database) {
        infoStatut.textContent = "Service non disponible pour le moment.";
        return;
      }

      const matiere = getMatiereFromURL();
      if (!matiere) {
        infoStatut.textContent = "Matière non précisée.";
        return;
      }

      titreMatiere.textContent = "Devoirs — " + matiere;

      firebase.auth().onAuthStateChanged(function(user) {
        if (!user) {
          window.location.href = "connexion.html";
          return;
        }

        firebase.database().ref("devoirs_config").once("value")
          .then(function(snapConfig) {
            const configData = (snapConfig && snapConfig.exists()) ? snapConfig.val() : {};
            if (configData.active !== true) {
              infoStatut.textContent = "Les devoirs ne sont pas disponibles pour le moment.";
              return;
            }

            return firebase.database().ref("eleves/" + user.uid).once("value")
              .then(function(snap) {
                if (!snap || !snap.exists()) {
                  infoStatut.textContent = "Ton profil élève n'est pas complet.";
                  return;
                }

                const classe = snap.val().classe;
                if (!classe) {
                  infoStatut.textContent = "Ta classe n'est pas renseignée.";
                  return;
                }

                // Matière hors programme de la classe (voir programme.js)
                if (window.CF_PROGRAMME && !window.CF_PROGRAMME.autorisee(classe, matiere)) {
                  infoStatut.textContent = "Cette matière n’est pas au programme de ta classe (" + classe + ").";
                  return;
                }

                chargerDevoirs(classe, matiere);
              });
          })
          .catch(function(err) {
            console.error("Erreur lecture profil élève :", err);
            infoStatut.textContent = "Impossible de charger ton profil.";
          });
      });
    });

    function formaterChronoDevoir(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return (m < 10 ? "0" : "") + m + ":" + (sec < 10 ? "0" : "") + sec;
    }

    function demarrerChronoDevoir(zoneId, dv) {
      const zone = document.getElementById(zoneId);
      if (!zone) return;

      const btnCommencer = zone.querySelector("button[data-action='commencer']");
      if (btnCommencer) btnCommencer.remove();

      const definitionsLiens = [];
      if (dv.devoirUrl) definitionsLiens.push({ href: dv.devoirUrl, texte: "Télécharger le devoir (PDF)" });
      if (dv.devoirWordUrl) definitionsLiens.push({ href: dv.devoirWordUrl, texte: "Télécharger le devoir (Word)" });

      const liensDevoir = definitionsLiens.map(function(d) {
        const a = document.createElement("a");
        a.className = "btn";
        a.href = d.href;
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = d.texte;
        return a;
      });
      liensDevoir.slice().reverse().forEach(function(a) { zone.insertBefore(a, zone.firstChild); });

      const chronoSpan = document.createElement("span");
      chronoSpan.className = "chrono-devoir";
      zone.insertBefore(chronoSpan, liensDevoir[0] || zone.firstChild);

      let blocTexte = null;
      if (dv.enonceHtml) {
        blocTexte = document.createElement("div");
        blocTexte.className = "texte-devoir";
        blocTexte.innerHTML = dv.enonceHtml;
        zone.parentNode.insertBefore(blocTexte, zone.nextSibling);
      }

      let secondesRestantes = dv.duree * 60;
      chronoSpan.textContent = "Temps restant : " + formaterChronoDevoir(secondesRestantes);

      const intervalId = setInterval(function() {
        secondesRestantes--;

        if (secondesRestantes <= 0) {
          clearInterval(intervalId);
          chronoSpan.textContent = "Temps écoulé";
          chronoSpan.style.color = "var(--error, #c0392b)";
          liensDevoir.forEach(function(a) { a.remove(); });
          if (blocTexte) blocTexte.remove();
          return;
        }

        if (secondesRestantes <= 60) {
          chronoSpan.style.color = "var(--error, #c0392b)";
        }

        chronoSpan.textContent = "Temps restant : " + formaterChronoDevoir(secondesRestantes);
      }, 1000);
    }

    function chargerDevoirs(classe, matiere) {
      classeEleve = classe;
      matiereCourante = matiere;

      firebase.database().ref("devoirs/" + classe + "/" + matiere).once("value")
        .then(function(snap) {
          if (!snap || !snap.exists()) {
            infoStatut.textContent = "Aucun devoir disponible pour le moment pour ta classe (" + classe + ").";
            return;
          }

          tousLesDevoirs = snap.val();
          infoStatut.textContent = "Devoirs disponibles pour ta classe (" + classe + ") :";

          preparerParties();
          afficherDevoirs();
        })
        .catch(function(err) {
          console.error("Erreur chargement devoirs :", err);
          infoStatut.textContent = "Impossible de charger les devoirs pour le moment.";
        });
    }

    // Français de la 6e à la 3e : deux types (Lecture, Communication écrite). Au second cycle : français seul.
    function preparerParties() {
      zoneParties.innerHTML = "";
      zoneParties.hidden = true;
      partieChoisie = "tous";

      const nomMatiere = (matiereCourante || "").toLowerCase();
      if (nomMatiere !== "français" && nomMatiere !== "francais") { return; }
      if (!window.CF_PROGRAMME) { return; }
      const parties = window.CF_PROGRAMME.partiesFrancais(classeEleve);
      if (!parties.length) { return; }

      const choix = [{ id: "tous", nom: "Tous" }].concat(parties);
      choix.forEach(function(p) {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = p.nom;
        b.setAttribute("aria-pressed", p.id === "tous" ? "true" : "false");
        b.addEventListener("click", function() {
          partieChoisie = p.id;
          Array.prototype.forEach.call(zoneParties.children, function(x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
          afficherDevoirs();
        });
        zoneParties.appendChild(b);
      });
      zoneParties.hidden = false;
    }

    function nomPartie(id) {
      if (id === "lecture") { return "Lecture"; }
      if (id === "communication-ecrite") { return "Communication écrite"; }
      return "";
    }

    function afficherDevoirs() {
      listeDevoirs.innerHTML = "";
      const maintenant = Date.now();
      let nb = 0;

      Object.keys(tousLesDevoirs).forEach(function(id) {
        const dv = tousLesDevoirs[id];
        // Un devoir marqué « lecture » ou « communication-ecrite » n'apparaît que dans son type ; sans marque, il apparaît partout
        if (partieChoisie !== "tous" && dv.partie && dv.partie !== partieChoisie) { return; }
        nb++;

        const card = document.createElement("div");
        card.className = "devoir-card";

        const aDevoir = dv.devoirUrl || dv.devoirWordUrl || dv.enonceHtml;
        const aCorrige = dv.corrigeUrl || dv.corrigeWordUrl || dv.corrigeHtml;
        const corrigeDisponible = aCorrige && dv.dateCorrige && maintenant >= dv.dateCorrige;
        const zoneDevoirId = "zone-devoir-" + id;

        let html = "";
        if (dv.partie && nomPartie(dv.partie)) { html += "<span class='partie-badge'>" + esc(nomPartie(dv.partie)) + "</span>"; }
        html += "<h3>" + esc(dv.titre || "Devoir") + "</h3>";
        html += "<p class='meta'>" + esc(dv.sequence || "") + (dv.duree ? " — chronométré (" + esc(dv.duree) + " min)" : "") + "</p>";
        html += "<div class='liens' id='" + esc(zoneDevoirId) + "'>";

        if (aDevoir) {
          if (dv.duree) {
            html += "<button class='btn' data-action='commencer' data-id='" + esc(id) + "'>Commencer (" + esc(dv.duree) + " min)</button>";
          } else {
            if (dv.devoirUrl) html += "<a class='btn' href='" + esc(dv.devoirUrl) + "' target='_blank' rel='noopener'>Télécharger le devoir (PDF)</a>";
            if (dv.devoirWordUrl) html += "<a class='btn' href='" + esc(dv.devoirWordUrl) + "' target='_blank' rel='noopener'>Télécharger le devoir (Word)</a>";
          }
        }

        if (aCorrige) {
          if (corrigeDisponible) {
            if (dv.corrigeUrl) html += "<a class='btn corrige' href='" + esc(dv.corrigeUrl) + "' target='_blank' rel='noopener'>Voir le corrigé (PDF)</a>";
            if (dv.corrigeWordUrl) html += "<a class='btn corrige' href='" + esc(dv.corrigeWordUrl) + "' target='_blank' rel='noopener'>Télécharger le corrigé (Word)</a>";
          } else {
            const texteAttente = dv.dateCorrige
              ? "Corrigé disponible le " + formaterDate(dv.dateCorrige)
              : "Corrigé pas encore disponible";
            html += "<span class='btn verrouille'>" + esc(texteAttente) + "</span>";
          }
        }

        html += "</div>";

        if (dv.enonceHtml && !dv.duree) {
          html += "<div class='texte-devoir'>" + dv.enonceHtml + "</div>";
        }

        if (corrigeDisponible && dv.corrigeHtml) {
          html += "<details class='texte-corrige'><summary class='btn corrige'>Voir le corrigé (texte)</summary><div class='contenu-corrige'>" + dv.corrigeHtml + "</div></details>";
        }

        card.innerHTML = html;
        listeDevoirs.appendChild(card);

        if (aDevoir && dv.duree) {
          const btnCommencer = card.querySelector("button[data-action='commencer']");
          btnCommencer.addEventListener("click", function() {
            demarrerChronoDevoir(zoneDevoirId, dv);
          });
        }
      });

      if (!nb) {
        const vide = document.createElement("p");
        vide.className = "aide";
        vide.textContent = "Aucun devoir de ce type pour le moment.";
        listeDevoirs.appendChild(vide);
      }
    }
</script>

</body>
</html>
